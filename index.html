<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#000">
  <title>APEX</title>
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22APEX%22%2C%22short_name%22%3A%22APEX%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23000000%22%2C%22theme_color%22%3A%22%23000000%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%2520viewBox%3D'0%25200%2520512%2520512'%253E%253Crect%2520width%3D'512'%2520height%3D'512'%2520fill%3D'%2523000'%2F%253E%253Cpath%2520d%3D'M256%2520108L140%2520404h38l28-74h100l28%252074h38L256%2520108zm-38%2520190l38-102%252038%2520102h-76z'%2520fill%3D'%2523fff'%2F%253E%253C%2Fsvg%3E%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%7D">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%23000'/%3E%3Cpath d='M256 108L140 404h38l28-74h100l28 74h38L256 108zm-38 190l38-102 38 102h-76z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%23000'/%3E%3Cpath d='M256 108L140 404h38l28-74h100l28 74h38L256 108zm-38 190l38-102 38 102h-76z' fill='%23fff'/%3E%3C/svg%3E">
  <style>
    :root{color-scheme:light dark;--gap:4px}
    :root[data-theme=light]{color-scheme:light}
    :root[data-theme=dark]{color-scheme:dark}
    *{box-sizing:border-box;margin:0;padding:0;border-radius:0!important;transition:none!important;animation:none!important;box-shadow:none!important}
    [hidden]{display:none!important}
    body{
      display:flex;flex-direction:column;gap:var(--gap);
      padding:var(--gap) var(--gap) 60px;
      font:14px/1.3 sans-serif;overflow-wrap:anywhere;overflow-x:hidden;
    }
    img,video{max-width:100%;height:auto;border:none}
    header,footer,main,#tools,#box-form,#box-nota{display:flex;flex-wrap:wrap;gap:var(--gap);width:100%}
    header,footer{background:Canvas;color:CanvasText;z-index:10}
    header{position:sticky;top:0;flex-wrap:nowrap;padding-top:env(safe-area-inset-top,0px)}
    footer{position:fixed;inset:auto 0 0;padding:var(--gap);padding-bottom:calc(var(--gap) + env(safe-area-inset-bottom,0px))}
    button,input,select,textarea{
      flex:1 1 130px;min-width:0;min-height:48px;padding:8px 10px;
      border:1px solid;background:none;color:inherit;font:inherit;
    }
    textarea{display:block;resize:vertical;min-height:80px}
    textarea[data-col="hide"],textarea[data-col="konten"]{flex:1 1 100%;width:100%;min-height:calc(100dvh - 180px)}
    header>input{flex:1;min-width:60px}
    header>button{flex:none;min-width:48px;padding:8px 12px}
    #msg{padding:6px 4px;font-weight:bold}
    #box-dash,#list{display:grid;gap:var(--gap);width:100%}
    #box-dash{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}
    #box-dash>button{padding:10px 8px;text-align:left;min-height:52px}
    #list{grid-template-columns:minmax(0,1fr)}
    #list>div{padding:12px 4px;min-height:48px;display:flex;align-items:center}
    body[data-grid="1"] #list{grid-template-columns:repeat(auto-fill,minmax(min(100%,max(130px,calc(20% - 4px))),1fr))}
    body[data-grid="1"] #list>div{flex-direction:column;align-items:flex-start;padding:4px}
    body[data-grid="1"] #list img{display:block;width:100%;height:85px;object-fit:cover;margin-bottom:4px}
    #tape{width:100%;max-width:280px;white-space:pre-wrap;font:12px/1.25 monospace}
    @media print{
      body{padding:0}
      header,footer,#tools,#msg{display:none!important}
      #tape{width:58mm!important;max-width:none}
    }
  </style>
  <script>try{var t=localStorage.theme;if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
  <header id="h">
    <button data-a="menu">≡</button>
    <input type="search" id="q" placeholder="Cari..." autocomplete="off">
    <button data-a="refresh" title="Sync / Refresh">↻</button>
    <button data-a="scan" title="Scan Barcode / QR">📷</button>
    <button data-a="add">add</button>
  </header>
  <p id="msg" data-a="closemsg" hidden></p>
  <div id="scan-box" hidden>
    <video id="scan-vid" autoplay playsinline muted></video>
    <button data-a="stop-scan">✕ Tutup Scanner</button>
  </div>
  <main>
    <div id="tools">
      <select id="sh-sel" data-a="sh-sel"></select>
      <select id="st-sel" data-a="st-sel"></select>
      <button data-a="dir">^</button>
      <button data-a="grid">#</button>
      <select id="act-sel" data-a="act-sel">
        <option value="" disabled selected>act</option>
        <option value="edit">edit</option>
        <option value="tsv">tsv export</option>
        <option value="imp">import</option>
        <option value="clear">clear</option>
      </select>
    </div>
    <div id="box-form"></div>
    <div id="box-dash"></div>
    <div id="box-nota"><pre id="tape"></pre></div>
    <div id="list"></div>
  </main>
  <footer id="ft"></footer>
  <input id="f-cam" type="file" accept="image/*" capture="environment" hidden>
  <input id="f-img" type="file" accept="image/*" hidden>
  <input id="f-doc" type="file" hidden>
  <input id="f-imp" type="file" accept=".tsv,.txt,.csv" hidden>

  <script>
  'use strict';

  /* ============================================================
     1. KONFIGURASI DINAMIS SSOT
     ============================================================ */
  const HARD = {
    d1Url: 'https://aiza5.aizaciruji0.workers.dev',
    gasUrl: 'https://script.google.com/macros/s/AKfycbzaLGQzwe3hoGekhRpMXgg3KOFA2YCdW5jvu5AY4LEoJGWgoXx-_jtz_GgMybDWxKKq/exec',
    store: { name: 'TB. AIZA CIRUJI', sub: 'Jl. Raya Saketi-Bayah', phone: '08787 117 6447', bank: 'BRI 0166 0113 7004 507', footer: 'Terima kasih' },
    shs: ['penjualan', 'produk_jual', 'produk', 'pembelian', 'produk_beli', 'kas', 'kontak', 'cicil', 'ecer', 'users', 'roles', 'cms', 'absen', 'toko', 'skema'],
    cols: {
      penjualan: ['idpenjualan', 'user', 'date', 'bayar', 'catatan', 'diskon', 'idkontak', 'lokasi', 'foto', 'status'],
      produk_jual: ['idprodukjual', 'idpenjualan', 'idproduk', 'namaproduk', 'hargabeli', 'hargajual', 'qty', 'diskon', 'catatan'],
      produk: ['idproduk', 'subkategori', 'kategori', 'namaproduk', 'hargabeli', 'hargajual', 'stok', 'foto'],
      pembelian: ['idpembelian', 'user', 'date', 'bayar', 'catatan', 'idkontak', 'lokasi', 'foto', 'status'],
      produk_beli: ['idprodukbeli', 'idpembelian', 'idproduk', 'namaproduk', 'hargabeli', 'hargajual', 'qty'],
      kas: ['idkas', 'user', 'date', 'kategori', 'masuk', 'keluar', 'uraian', 'foto'],
      kontak: ['idkontak', 'user', 'kategori', 'nama', 'alamat', 'hp', 'lokasi', 'foto'],
      cicil: ['idcicil', 'idpenjualan', 'user', 'date', 'jumlah', 'catatan', 'idkontak'],
      ecer: ['idecer', 'date', 'user', 'idproduk', 'namaproduk', 'hargabeli', 'hargajual', 'qty', 'diskon', 'catatan'],
      users: ['user', 'password', 'role'],
      roles: ['role', 'hide', 'validasi'],
      cms: ['idcms', 'date', 'user', 'judul', 'kategori', 'foto', 'file', 'status', 'konten'],
      absen: ['idabsen', 'user', 'date', 'tipe', 'jam', 'lokasi', 'foto', 'catatan'],
      toko: ['id', 'name', 'sub', 'phone', 'bank', 'footer'],
      skema: ['sheet', 'cols', 'vis', 'form']
    },
    vis: {
      penjualan: ['date', 'idkontak', 'status', 'user'],
      produk_jual: ['namaproduk', 'qty', 'hargajual'],
      produk: ['namaproduk', 'stok', 'hargajual'],
      pembelian: ['date', 'idkontak', 'status', 'user'],
      produk_beli: ['namaproduk', 'qty', 'hargabeli'],
      kas: ['date', 'kategori', 'uraian', 'masuk', 'keluar'],
      kontak: ['nama', 'hp', 'kategori'],
      cicil: ['date', 'idpenjualan', 'jumlah'],
      ecer: ['date', 'namaproduk', 'qty'],
      users: ['user', 'role'],
      roles: ['role', 'hide'],
      cms: ['judul', 'kategori', 'status'],
      absen: ['date', 'user', 'tipe', 'jam'],
      toko: ['id', 'name', 'phone'],
      skema: ['sheet', 'cols', 'vis']
    },
    db: {}
  };
  HARD.shs.forEach(s => { HARD.db[s] = []; });
  HARD.db.skema = HARD.shs.map(s => [
    s,
    (HARD.cols[s] || []).join(','),
    (HARD.vis[s] || []).join(','),
    (HARD.cols[s] || []).join(',')
  ]);

  /* ============================================================
     2. MESIN UTAMA APEX ULTRA PWA KISS ABSOLUTE
     ============================================================ */
  const W = window, L = localStorage, $ = id => document.getElementById(id);
  let db = null, syncing = false, syncDebounce = null, persistDebounce = null, scanStream = null, scanTimer = null;

  const bc = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('sync') : { postMessage() {}, onmessage: null };
  const softRender = () => {
    const ae = document.activeElement;
    if (ae && (ae.id === 'q' || dom.fb.contains(ae) || dom.db.contains(ae))) return;
    if (K.u && K.idx === null && K.v !== 'edit') render();
  };
  bc.onmessage = e => {
    if (e.data === 'synced') idbGet('apex_matrix').then(m => { if (m && typeof m === 'object') Object.assign(K.db, m); applySchemaTable(); softRender(); });
    else if (e.data === 'kick' && !syncing) syn();
  };

  /* ---------------- IndexedDB ---------------- */
  function initDB(cb) {
    try {
      const rq = indexedDB.open('apex_db', 1);
      rq.onupgradeneeded = e => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
        if (!d.objectStoreNames.contains('mut')) d.createObjectStore('mut', { keyPath: 'i' });
      };
      rq.onsuccess = e => { db = e.target.result; cb?.(db); };
      rq.onerror = () => cb?.(null);
    } catch { cb?.(null); }
  }
  const idbGet = (key, st = 'kv') => new Promise(res => {
    if (!db) return res(null);
    try { const rq = db.transaction(st, 'readonly').objectStore(st).get(key); rq.onsuccess = () => res(rq.result ?? null); rq.onerror = () => res(null); } catch { res(null); }
  });
  const idbGetAll = (st = 'mut') => new Promise(res => {
    if (!db) return res([]);
    try { const rq = db.transaction(st, 'readonly').objectStore(st).getAll(); rq.onsuccess = () => res(rq.result ?? []); rq.onerror = () => res([]); } catch { res([]); }
  });
  function idbPut(val, key = null, st = 'kv') {
    if (!db) return;
    try {
      const s = db.transaction(st, 'readwrite').objectStore(st);
      st === 'kv' && key != null ? s.put(val, key) : s.put(val);
    } catch {}
  }
  function idbClearStore(st) {
    if (!db) return;
    try { if (db.objectStoreNames.contains(st)) db.transaction(st, 'readwrite').objectStore(st).clear(); } catch {}
  }
  function idbDelKeys(keys, st = 'mut') {
    if (!db || !keys?.length) return;
    try {
      const s = db.transaction(st, 'readwrite').objectStore(st);
      keys.forEach(k => s.delete(k));
    } catch {}
  }

  /* ---------------- Antrean Mutasi FIFO ---------------- */
  let seq = 0, saves = 0;
  function save(row, targetTable = K.cur, actionType = 2) {
    saves++;
    idbPut({
      i: Date.now().toString(36) + (seq = (seq + 1) % 46656).toString(36).padStart(3, '0') + Math.random().toString(36).slice(2, 4),
      tn: targetTable,
      y: actionType,
      r: Array.isArray(row) ? row : Object.values(row),
      ts: Date.now()
    }, null, 'mut');
    bc.postMessage('kick');
    clearTimeout(syncDebounce);
    syncDebounce = setTimeout(() => syn(false), 80);
  }

  /* ---------------- Transport ---------------- */
  const SYNC_ACTIONS = ['pull_batch', 'manifest', 'push', 'sync_gas'];

  async function req(p = {}) {
    if (!navigator.onLine) return null;
    const isSync = SYNC_ACTIONS.includes(p.a);
    const urls = [...new Set([HARD.d1Url, HARD.gasUrl].filter(u => typeof u === 'string' && /^https?:\/\//i.test(u)))];
    if (!urls.length) return null;

    for (const url of urls) {
      if (isSync && url === HARD.gasUrl && HARD.d1Url && p.a === 'sync_gas') continue;
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(p),
          signal: AbortSignal.timeout(30000),
          redirect: 'follow'
        });
        if (!res.ok) continue;
        const r = await res.json();
        if (r && (r.ok || r.data || r.v || r.status)) return r;
      } catch {}
    }
    return null;
  }

  function remapRows(rows, srcCols, dstCols) {
    if (!Array.isArray(rows) || !Array.isArray(srcCols) || !Array.isArray(dstCols)) return rows || [];
    const sLow = srcCols.map(S2), dLow = dstCols.map(S2);
    if (sLow.length === dLow.length && sLow.every((c, i) => c === dLow[i])) return rows;
    const idxMap = dLow.map(c => sLow.indexOf(c));
    return rows.map(r => idxMap.map(idx => (idx >= 0 && idx < r.length) ? r[idx] : ''));
  }

  /* ---------------- Sinkronisasi Latar 2 Arah ---------------- */
  async function syn(force = false) {
    if (syncing) return;
    if (!navigator.onLine) { if (force) msg('offline'); return; }
    syncing = true;
    if (force) msg('syncing...');
    try {
      const mRes = await req({ a: 'manifest', tn: K.shs, cols: K.cols });
      let m = mRes?.data || mRes;
      if (!m?.v) throw new Error('manifest');

      const queued = await idbGetAll('mut'), seed = [];
      K.shs.forEach((t, i) => {
        if ((m.v[i] === '0_0_0' || m.v[i] === '0_0' || !m.v[i]) && (K.db[t] || []).length) {
          (K.db[t] || []).forEach(row => seed.push({ tn: t, y: 2, r: row }));
        }
      });
      if (queued.length || seed.length) {
        const pr = await req({ a: 'push', m: [...seed, ...queued], tn: K.shs, cols: K.cols, gasUrl: HARD.gasUrl });
        if (!pr?.ok) throw new Error('push');
        idbDelKeys(queued.map(x => x.i), 'mut');
        m = pr.manifest || m;
      }
      if (force && HARD.d1Url && HARD.gasUrl) {
        const sg = await req({ a: 'sync_gas', tn: K.shs, cols: K.cols, gasUrl: HARD.gasUrl });
        if (sg?.ok && Array.isArray(sg.shs)) {
          let addedNew = false;
          sg.shs.forEach(s => {
            if (!K.shs.includes(s)) { K.shs.push(s); addedNew = true; }
            const sc = sg.cols?.[s];
            if (Array.isArray(sc) && sc.length) {
              if (!K.cols[s]) K.cols[s] = sc;
              const si = (K.db.skema || []).findIndex(r => S2(r[0]) === S2(s));
              if (si === -1) {
                (K.db.skema = K.db.skema || []).push([s, sc.join(','), sc.slice(0, 4).join(','), sc.join(',')]);
                addedNew = true;
              }
            }
          });
          if (addedNew) applySchemaTable();
          if (sg.v) m.v = sg.v;
        }
      }

      const toPull = [];
      K.shs.forEach((t, i) => {
        const srv = m.v?.[i];
        if (!srv || srv === '0_0_0' || srv === '0_0') return;
        if (force || srv !== K.ver[t] || (srv !== '0_0_0' && !(K.db[t] || []).length)) {
          toPull.push({ t: i, v: srv });
        }
      });

      if (toPull.length) {
        const s0 = saves;
        const pRes = await req({ a: 'pull_batch', reqs: toPull, tn: K.shs, cols: K.cols });
        const d = pRes?.data || pRes;
        if (d?.results && saves === s0) {
          d.results.forEach(x => {
            const name = K.shs[x.t];
            if (!name) return;
            if (name === 'skema' && Array.isArray(x.r) && x.r.length) {
              K.db.skema = x.r;
              applySchemaTable();
            } else {
              if (Array.isArray(x.cols) && x.cols.length && !K.cols[name]) K.cols[name] = x.cols;
              K.db[name] = remapRows(x.r || [], x.cols || K.cols[name], K.cols[name]);
            }
            K.ver[name] = x.v || m.v[x.t];
          });
          applySchemaTable();
          persist();
          bc.postMessage('synced');
          softRender();
        }
      }
      if (force) msg('synced');
    } catch {
      if (force) msg('offline');
    } finally {
      syncing = false;
      idbGetAll('mut').then(q => {
        if (q.length && navigator.onLine) {
          clearTimeout(syncDebounce);
          syncDebounce = setTimeout(() => syn(false), 350);
        }
      });
    }
  }

  /* ---------------- Inisialisasi State & DOM ---------------- */
  let saved = {};
  try { saved = JSON.parse(L.apex || '{}'); } catch {}

  const K = {
    v: 'dash', u: '', cur: 'produk', idx: null, ret: null,
    sort: '', dir: 1, grid: 0, lim: 25,
    df: '', dt: '', du: '', dk: '', slice: '',
    ...saved,
    shs: [...HARD.shs], cols: {}, vis: {}, fvis: {},
    db: structuredClone(HARD.db), ver: {}
  };
  HARD.shs.forEach(s => { K.cols[s] = [...HARD.cols[s]]; K.vis[s] = [...HARD.vis[s]]; K.fvis[s] = [...HARD.cols[s]]; });

  const dom = {
    q: $('q'), msg: $('msg'), tools: $('tools'), sh: $('sh-sel'), st: $('st-sel'),
    fb: $('box-form'), db: $('box-dash'), nb: $('box-nota'), tp: $('tape'),
    ls: $('list'), ft: $('ft'),
    fCam: $('f-cam'), fImg: $('f-img'), fDoc: $('f-doc'), fImp: $('f-imp'),
    scanBox: $('scan-box'), scanVid: $('scan-vid')
  };

  const EXEMPTS = new Set(['closemsg', 'menu', 'theme', 'logout', 'reset-db', 'back', 'login', 'reg', 'bypass', 'refresh']);
  const IMG_COLS = new Set(['foto', 'gambar', 'img', 'image']);
  const NUM_COLS = new Set(['hargabeli', 'hargajual', 'qty', 'diskon', 'stok', 'bayar', 'jumlah', 'masuk', 'keluar']);
  const REF_ALIASES = { idjual: 'penjualan', idpenjualan: 'penjualan', idbeli: 'pembelian', idpembelian: 'pembelian', role: 'roles', sheet: 'skema' };

  function dl(content, fileName, mime = 'text/plain;charset=utf-8') {
    const a = Object.assign(document.createElement('a'), {
      href: content instanceof Blob ? URL.createObjectURL(content) : content.startsWith('data:') ? content : 'data:' + mime + ',' + encodeURIComponent(content),
      download: fileName
    });
    a.click();
    if (content instanceof Blob) setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  /* ---------------- Manajemen Skema Dinamis ---------------- */
  function applySchemaTable() {
    const skRows = K.db.skema || [];
    if (!skRows.length) return;
    const seen = new Set();
    skRows.forEach(r => {
      const sh = S2(r[0]);
      if (!sh || seen.has(sh)) return;
      seen.add(sh);
      const parseList = (str, fb) => {
        const arr = String(str || '').split(',').map(S2).filter(Boolean);
        return arr.length ? [...new Set(arr)] : fb;
      };
      const oldCols = K.cols[sh];
      const newCols = parseList(r[1], HARD.cols[sh] || ['id', 'nama']);
      if (oldCols && Array.isArray(K.db[sh]) && K.db[sh].length) {
        K.db[sh] = remapRows(K.db[sh], oldCols, newCols);
      }
      K.cols[sh] = newCols;
      K.vis[sh] = parseList(r[2], HARD.vis[sh] || K.cols[sh].slice(0, 4));
      K.fvis[sh] = parseList(r[3], K.cols[sh]);
      if (!K.db[sh]) K.db[sh] = [];
    });
    K.shs = [...seen];
    HARD.shs.forEach(s => {
      if (!seen.has(s)) {
        K.shs.push(s);
        K.cols[s] = [...HARD.cols[s]];
        K.vis[s] = [...HARD.vis[s]];
        K.fvis[s] = [...HARD.cols[s]];
        if (!K.db[s]) K.db[s] = [];
      }
    });
    Object.keys(K.db).forEach(s => { if (!K.shs.includes(s)) delete K.db[s]; });
    if (!K.shs.includes(K.cur)) K.cur = K.shs[0] || 'produk';
  }

  function getStore() {
    const r = (K.db.toko || [])[0];
    if (!r) return HARD.store;
    return {
      name: cV(r, 'toko', 'name') || HARD.store.name,
      sub: cV(r, 'toko', 'sub') || HARD.store.sub,
      phone: cV(r, 'toko', 'phone') || HARD.store.phone,
      bank: cV(r, 'toko', 'bank') || HARD.store.bank,
      footer: cV(r, 'toko', 'footer') || HARD.store.footer
    };
  }

  /* ---------------- Helper Umum ---------------- */
  const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  const isSafeUrl = u => /^(https?:\/\/|data:(image\/|application\/|text\/))/i.test(String(u || '').trim());
  const S2 = s => String(s ?? '').trim().toLowerCase();
  const N = v => Math.max(0, Number(String(v ?? '').replace(/[^0-9.-]/g, '')) || 0);
  const Z = v => Number(String(v ?? '').replace(/[^0-9.-]/g, '')) || 0;
  const cols = (s = K.cur) => K.cols[s] || HARD.cols[s] || [];
  const cI = (s, k) => cols(s).map(S2).indexOf(S2(k));
  const cV = (r, s, k) => { const i = cI(s, k); return i > -1 ? (r[i] ?? '') : ''; };
  const vis = (s = K.cur) => K.vis[s] || HARD.vis[s] || cols(s);
  const fvis = (s = K.cur) => K.fvis[s] || cols(s);
  const isTrx = (s = K.cur) => s === 'penjualan' || s === 'pembelian';
  const isOpenStatus = st => st === 'draft' || st === 'revisi';
  const childOf = t => t === 'penjualan' ? 'produk_jual' : 'produk_beli';
  const parentOf = s => s === 'produk_jual' ? 'penjualan' : s === 'produk_beli' ? 'pembelian' : '';
  const fkCol = s => cI(s, 'idpenjualan') > -1 ? 'idpenjualan' : cI(s, 'idpembelian') > -1 ? 'idpembelian' : 'idjual';
  const genId = () => {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    return `${p(d.getHours())}${p(d.getMinutes())}${Math.random().toString(36).slice(2, 6)}`;
  };
  const fmtNum = n => (Number(n) || 0).toLocaleString('id-ID');
  const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  const msg = t => { dom.msg.textContent = t || ''; dom.msg.hidden = !t; };
  const getTheme = () => document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
  function applyTheme(t) {
    document.documentElement.dataset.theme = L.theme = t;
    const m = document.querySelector('meta[name=theme-color]');
    if (m) m.content = t === 'dark' ? '#000' : '#fff';
  }
  const fld = c => dom.fb.querySelector(`[data-col="${c}"]`);
  const flds = () => [...dom.fb.querySelectorAll('[data-col]')];
  const fldBy = re => flds().find(x => re.test(x.dataset.col));
  const formState = () => Object.fromEntries(flds().map(x => [x.dataset.col, x.value]));

  function prodMap() {
    const m = new Map();
    (K.db.produk || []).forEach(p => m.set(S2(cV(p, 'produk', 'idproduk')), p));
    return m;
  }
  function kontakMap() {
    const m = new Map();
    (K.db.kontak || []).forEach(k => {
      const id = S2(cV(k, 'kontak', 'idkontak'));
      const nm = cV(k, 'kontak', 'nama');
      if (id && nm) m.set(id, nm);
    });
    return m;
  }
  const resolveKontakName = (kId, km) => {
    if (!kId) return '';
    const nm = km ? km.get(S2(kId)) : (K.db.kontak || []).find(k => S2(cV(k, 'kontak', 'idkontak')) === S2(kId))?.[cI('kontak', 'nama')];
    return nm ? `${nm} (${kId})` : kId;
  };

  /* ---------------- Navigasi State Tunggal ---------------- */
  function setView(v, idx = null) {
    K.v = v;
    K.idx = idx;
    if (v === 'dash') K.slice = '';
  }

  /* ---------------- Hak Akses (RBAC) ---------------- */
  const pwCol = () => cI('users', 'password') > -1 ? 'password' : 'pass';
  function userRow(u, role, pw = '') {
    const r = cols('users').map(() => '');
    const ui = cI('users', 'user'), ri = cI('users', 'role'), pi = pwCol();
    if (ui > -1) r[ui] = u;
    if (ri > -1) r[ri] = role;
    if (pi > -1) r[pi] = pw;
    return r;
  }
  function getRole() {
    const u = (K.db.users || []).find(r => S2(cV(r, 'users', 'user')) === S2(K.u));
    return u ? S2(cV(u, 'users', 'role')) : '';
  }
  const isAdmin = () => getRole() === 'admin';
  function isUserVisible(r, sh = K.cur) {
    if (isAdmin() || !K.u) return true;
    const ui = cI(sh, 'user');
    return ui === -1 || !r[ui] || S2(r[ui]) === S2(K.u);
  }
  function getRoleRules() {
    const rl = getRole();
    if (!rl || rl === 'admin') return new Set();
    const row = (K.db.roles || []).find(r => S2(cV(r, 'roles', 'role')) === rl);
    return new Set(String(row ? cV(row, 'roles', 'validasi') : '').split(',').map(S2).filter(Boolean));
  }
  function hasAccess(k, s = K.cur) {
    if (EXEMPTS.has(k) || !K.u) return true;
    const rl = getRole();
    if (!rl || rl === 'admin') return true;
    const row = (K.db.roles || []).find(r => S2(cV(r, 'roles', 'role')) === rl);
    const hidden = new Set(String(row ? cV(row, 'roles', 'hide') : '').split(',').map(S2).filter(Boolean));
    const sk = S2(k), ss = S2(s);
    if (hidden.has(sk) || hidden.has(`${ss}.${sk}`)) return false;
    if (sk === 'save-row' && (hidden.has('save') || hidden.has(`${ss}.save`))) return false;
    if (sk === 'del-row' && (hidden.has('del') || hidden.has(`${ss}.del`))) return false;
    if (sk === 'v-dash' && hidden.has('dash')) return false;
    if (sk === 'v-shop' && hidden.has('produk')) return false;
    if (sk === 'v-jual' && (hidden.has('penjualan') || hidden.has('produk_jual'))) return false;
    if (sk === 'v-beli' && (hidden.has('pembelian') || hidden.has('produk_beli'))) return false;
    if (sk === 'v-kas' && hidden.has('kas')) return false;
    return true;
  }

  function addFooter(a, txt, sheet = K.cur, extra = '') {
    if (!hasAccess(a, sheet)) return;
    dom.ft.insertAdjacentHTML('beforeend', `<button data-a="${a}" ${extra}>${txt}</button>`);
  }

  /* ---------------- Filter Terpadu Dashboard & List ---------------- */
  function matchFilter(u, d, meta = '', skipDate = false, qWords = []) {
    const effU = !isAdmin() ? K.u : K.du;
    if (effU && u && S2(u) !== S2(effU)) return false;
    if (!skipDate) {
      const ds = String(d || '').slice(0, 10);
      if (K.df && (!ds || ds < K.df)) return false;
      if (K.dt && (!ds || ds > K.dt)) return false;
    }
    if (K.dk) {
      const hay = `${u} ${d} ${meta}`.toLowerCase();
      if (!hay.includes(S2(K.dk))) return false;
    }
    if (qWords.length) {
      const hay = `${u} ${d} ${meta}`.toLowerCase();
      if (!qWords.every(w => hay.includes(w))) return false;
    }
    return true;
  }

  /* ---------------- Sinkronisasi Stok ---------------- */
  function syncStockDelta(sh, o, n) {
    const dir = sh === 'produk_jual' || sh === 'ecer' ? -1 : sh === 'produk_beli' ? 1 : 0;
    if (!dir) return;
    const pid = cV(n || o, sh, 'idproduk');
    const pnm = cV(n || o, sh, 'namaproduk');
    const pi = (K.db.produk || []).findIndex(p => (pid && S2(cV(p, 'produk', 'idproduk')) === S2(pid)) || (pnm && S2(cV(p, 'produk', 'namaproduk')) === S2(pnm)));
    const si = cI('produk', 'stok');
    if (pi === -1 || si === -1) return;
    const oldQ = o ? N(cV(o, sh, 'qty')) : 0;
    const newQ = n ? N(cV(n, sh, 'qty')) : 0;
    K.db.produk[pi][si] = String(Z(K.db.produk[pi][si]) + (newQ - oldQ) * dir);
    save(K.db.produk[pi], 'produk');
  }

  /* ---------------- Barcode / QR Scanner ---------------- */
  function stopScan() {
    clearInterval(scanTimer); scanTimer = null;
    if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
    dom.scanVid.srcObject = null;
    dom.scanBox.hidden = true;
  }
  async function startScan() {
    if (!dom.scanBox.hidden) return stopScan();
    if (!navigator.mediaDevices?.getUserMedia) return msg('Kamera tidak didukung di browser ini');
    try {
      scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      dom.scanVid.srcObject = scanStream;
      dom.scanBox.hidden = false;
      const Detector = window.BarcodeDetector;
      if (!Detector) return msg('Browser belum mendukung auto-detect barcode; gunakan pencarian manual');
      const det = new Detector({ formats: ['qr_code', 'ean_13', 'ean_8', 'code_128', 'code_39', 'upc_a', 'upc_e'] });
      scanTimer = setInterval(async () => {
        if (dom.scanVid.readyState < 2) return;
        try {
          const codes = await det.detect(dom.scanVid);
          if (codes?.[0]?.rawValue) {
            const val = codes[0].rawValue.trim();
            stopScan();
            msg('Scan: ' + val);
            if (K.idx !== null && fldBy(/idproduk|kode/i)) {
              const inp = fldBy(/idproduk|kode/i);
              inp.value = val;
              inp.dispatchEvent(new Event('input', { bubbles: true }));
            } else {
              K.cur = 'produk'; K.grid = 1; dom.q.value = val;
              setView('list'); render();
            }
          }
        } catch {}
      }, 300);
    } catch {
      stopScan();
      msg('Izin kamera ditolak / gagal dibuka');
    }
  }

  /* ---------------- Kalkulasi Transaksi, Cicilan & Nota ---------------- */
  function calcItems(t, id) {
    const ch = childOf(t), fk = fkCol(ch);
    let sub = 0, itemDisc = 0, cogs = 0, pot = 0;
    const items = (K.db[ch] || []).filter(r => cV(r, ch, fk) === id);
    items.forEach(r => {
      const q = N(cV(r, ch, 'qty'));
      const hb = N(cV(r, ch, 'hargabeli'));
      const hj = N(cV(r, ch, 'hargajual'));
      const d = N(cV(r, ch, 'diskon'));
      const p = t === 'penjualan' ? hj : hb;
      sub += p * q; itemDisc += d; cogs += hb * q; pot += hj * q;
    });
    return { items, sub, itemDisc, cogs, pot, net: Math.max(0, sub - itemDisc) };
  }

  const trxNet = (t, r) => Math.max(0, calcItems(t, cV(r, t, cols(t)[0])).net - N(cV(r, t, 'diskon')));

  function cicilMap() {
    const m = {};
    const fk = fkCol('cicil');
    (K.db.cicil || []).forEach(r => {
      const id = cV(r, 'cicil', fk) || cV(r, 'cicil', 'idjual');
      if (id) m[id] = (m[id] || 0) + N(cV(r, 'cicil', 'jumlah'));
    });
    return m;
  }

  const paidOf = (t, r, cm = cicilMap()) => N(cV(r, t, 'bayar')) + (t === 'penjualan' ? (cm[cV(r, t, cols(t)[0])] || 0) : 0);

  function statusFor(net, paid, kId) {
    if (net <= 0) return 'draft';
    if (paid >= net) return 'lunas';
    return kId ? 'piutang' : 'draft';
  }

  function calcContactDebt(kId) {
    if (!kId) return 0;
    const cm = cicilMap();
    return (K.db.penjualan || []).reduce((sum, r) => {
      if (S2(cV(r, 'penjualan', 'idkontak')) !== S2(kId)) return sum;
      if (isOpenStatus(S2(cV(r, 'penjualan', 'status')))) return sum;
      return sum + Math.max(0, trxNet('penjualan', r) - paidOf('penjualan', r, cm));
    }, 0);
  }

  function formatNota(id) {
    const ST = getStore();
    const r = (K.db.penjualan || []).find(x => cV(x, 'penjualan', 'idpenjualan') === id);
    if (!r) return 'Nota tidak ditemukan';
    const W = 32, ln = '-'.repeat(W);
    const pad = (a, b) => {
      a = String(a); b = String(b);
      return a.length + b.length >= W ? a + ' ' + b : a + ' '.repeat(W - a.length - b.length) + b;
    };
    const ctr = s => { s = String(s); return s.length >= W ? s : ' '.repeat((W - s.length) >> 1) + s; };
    const { items, sub, itemDisc } = calcItems('penjualan', id);
    const nDisc = N(cV(r, 'penjualan', 'diskon'));
    const tot = Math.max(0, sub - itemDisc - nDisc);
    const bayar = N(cV(r, 'penjualan', 'bayar'));
    const cicil = cicilMap()[id] || 0;
    const paid = bayar + cicil;
    const kId = cV(r, 'penjualan', 'idkontak');
    const kName = resolveKontakName(kId);
    const totPiutang = calcContactDebt(kId);

    const out = [ctr(ST.name), ctr(ST.sub), ctr('Telp: ' + ST.phone), ctr(ST.bank), ln, `No : ${id}`, `Tgl: ${cV(r, 'penjualan', 'date')}`, `Ksr: ${cV(r, 'penjualan', 'user')}`];
    if (kId) out.push(`Plg: ${kName}`);
    out.push(ln);
    items.forEach(it => {
      const q = N(cV(it, 'produk_jual', 'qty')), h = N(cV(it, 'produk_jual', 'hargajual')), d = N(cV(it, 'produk_jual', 'diskon'));
      out.push(cV(it, 'produk_jual', 'namaproduk'));
      out.push(pad(` ${q} x ${fmtNum(h)}${d ? ' -' + fmtNum(d) : ''}`, fmtNum(q * h - d)));
    });
    out.push(ln, pad('Subtotal', fmtNum(sub)));
    if (itemDisc + nDisc > 0) out.push(pad('Diskon', '-' + fmtNum(itemDisc + nDisc)));
    out.push(pad('TOTAL', fmtNum(tot)), pad('Bayar', fmtNum(bayar)));
    if (cicil > 0) out.push(pad('Cicilan', fmtNum(cicil)));
    if (paid >= tot) out.push(pad('Kembali', fmtNum(paid - tot)));
    else out.push(pad('Sisa Nota', fmtNum(tot - paid)));
    if (kId && totPiutang > 0) out.push(pad('Total Piutang', fmtNum(totPiutang)));
    out.push(ln, ctr(ST.footer));
    return out.join('\n');
  }

  function syncTrx(t, forceStatus = '') {
    const open = getOpenTrx(t);
    if (!open) return;
    const pk = cols(t)[0], id = cV(open, t, pk);
    const net = trxNet(t, open);
    const paid = paidOf(t, open);
    const kId = cV(open, t, 'idkontak');
    const stI = cI(t, 'status');
    const curSt = S2(open[stI]);
    let nextSt = forceStatus || (curSt === 'revisi' ? 'revisi' : statusFor(net, paid, kId));
    if (nextSt !== 'revisi' && nextSt !== 'draft' && paid < net && !kId) nextSt = 'draft';
    if (stI > -1 && open[stI] !== nextSt) {
      open[stI] = nextSt;
      save(open, t);
    }
  }

  function getOpenTrx(t) {
    const stI = cI(t, 'status'), uI = cI(t, 'user');
    return (K.db[t] || []).find(r => isOpenStatus(S2(r[stI])) && (!K.u || !r[uI] || S2(r[uI]) === S2(K.u)));
  }

  function hasDraftItems(t) {
    const open = getOpenTrx(t);
    if (!open) return false;
    const ch = childOf(t), fk = fkCol(ch);
    return (K.db[ch] || []).some(r => cV(r, ch, fk) === cV(open, t, cols(t)[0]));
  }

  function dropRows(sh, pred) {
    const keep = [];
    (K.db[sh] || []).forEach(r => {
      if (pred(r)) { syncStockDelta(sh, r, null); save(r, sh, 0); }
      else keep.push(r);
    });
    K.db[sh] = keep;
  }

  function dropTrxDeps(t, id) {
    const ch = childOf(t), fk = fkCol(ch);
    dropRows(ch, r => cV(r, ch, fk) === id);
    if (t === 'penjualan') {
      const cFk = fkCol('cicil');
      dropRows('cicil', r => (cV(r, 'cicil', cFk) || cV(r, 'cicil', 'idjual')) === id);
    }
  }

  /* ---------------- Katalog & Referensi ---------------- */
  function prefillProd(p) {
    const getP = col => { const i = cI('produk', col); return i > -1 ? (p[i] ?? '') : ''; };
    const t = K.cur === 'produk_beli' ? 'pembelian' : 'penjualan';
    let open = getOpenTrx(t);
    if (!open) {
      const r = cols(t).map(() => ''), setC = (c, v) => { const i = cI(t, c); if (i > -1) r[i] = v; };
      setC(cols(t)[0], genId()); setC('user', K.u); setC('date', today()); setC('status', 'draft');
      (K.db[t] = K.db[t] || []).push(r); save(r, t); open = r;
    } else if (cI(t, 'status') > -1 && !isOpenStatus(S2(open[cI(t, 'status')]))) {
      open[cI(t, 'status')] = 'draft'; save(open, t);
    }
    const ch = childOf(t), fk = fkCol(ch);
    K.prefill = { [fk]: cV(open, t, cols(t)[0]), idproduk: getP('idproduk'), namaproduk: getP('namaproduk'), hargabeli: getP('hargabeli'), hargajual: getP('hargajual'), qty: '1' };
  }

  function openProdForm(p) {
    const t = hasDraftItems('pembelian') ? 'pembelian' : 'penjualan';
    K.cur = childOf(t);
    prefillProd(p);
    setView('form', -1);
    render();
  }

  function prodTo(sheet) {
    const p = cols('produk').map(c => fld(c)?.value || '');
    K.cur = sheet;
    if (sheet === 'ecer') {
      K.prefill = { idecer: genId(), date: today(), user: K.u, idproduk: p[cI('produk', 'idproduk')], namaproduk: p[cI('produk', 'namaproduk')], hargabeli: p[cI('produk', 'hargabeli')], hargajual: p[cI('produk', 'hargajual')], qty: '1' };
    } else {
      prefillProd(p);
    }
    setView('form', -1);
    render();
  }

  function resolveRef(c, idx = -1) {
    const lc = S2(c);
    if (idx === 0 && !REF_ALIASES[lc]) return '';
    if (REF_ALIASES[lc]) return REF_ALIASES[lc];
    if (K.shs.includes(lc)) return lc;
    const naked = lc.replace(/^id/, '');
    if (naked && K.shs.includes(naked)) return naked;
    return '';
  }

  function hasRefMatch(trg, val) {
    const qv = S2(val);
    if (!qv || !trg || !K.db[trg]) return false;
    const tCols = cols(trg);
    const idIdx = tCols.findIndex(col => S2(col) === 'id' + trg || S2(col) === 'id' || S2(col) === trg || S2(col) === 'sheet');
    const chkIdx = idIdx > -1 ? idIdx : 0;
    return (K.db[trg] || []).some(r => S2(r[chkIdx]) === qv);
  }

  function refreshRefButtons() {
    flds().forEach(inp => {
      const btn = dom.ft.querySelector(`[data-a="ref"][data-col="${inp.dataset.col}"]`);
      if (!btn) return;
      const trg = resolveRef(inp.dataset.col, Number(inp.dataset.idx));
      btn.hidden = !(trg && hasRefMatch(trg, inp.value));
    });
  }

  /* ---------------- Query Daftar & Filter ---------------- */
  function queryRows() {
    const sh = K.cur, qWords = S2(dom.q.value).split(/\s+/).filter(Boolean), km = kontakMap(), cm = cicilMap();
    const pm = K.slice === 'sisa_stok' ? prodMap() : null;
    const soldQty = {};
    if (K.slice === 'sisa_stok') {
      (K.db.produk_jual || []).forEach(r => {
        const u = cV(r, 'produk_jual', 'user'), d = cV(r, 'produk_jual', 'date');
        if (!matchFilter(u, d, '', false)) return;
        const pid = S2(cV(r, 'produk_jual', 'idproduk'));
        if (pid) soldQty[pid] = (soldQty[pid] || 0) + N(cV(r, 'produk_jual', 'qty'));
      });
    }

    let rows = (K.db[sh] || []).map((r, i) => ({ r, i })).filter(({ r }) => isUserVisible(r, sh));

    if (K.slice) {
      rows = rows.filter(({ r }) => {
        const u = cV(r, sh, 'user');
        const d = cV(r, sh, 'date');
        const kt = cV(r, sh, 'kategori');
        const st = S2(cV(r, sh, 'status'));
        const meta = `${kt} ${cV(r, sh, 'uraian')} ${cV(r, sh, 'namaproduk')}`;

        if (K.slice === 'ready') return sh === 'produk' && Z(cV(r, 'produk', 'stok')) > 0 && matchFilter(u, d, meta, true);
        if (K.slice === 'sisa_stok') {
          if (sh !== 'produk') return false;
          const pid = S2(cV(r, 'produk', 'idproduk'));
          return (Z(cV(r, 'produk', 'stok')) > 0 || (soldQty[pid] || 0) > 0) && matchFilter(u, d, meta, true);
        }
        if (K.slice === 'piutang') {
          if (sh !== 'penjualan' || isOpenStatus(st)) return false;
          return (trxNet('penjualan', r) - paidOf('penjualan', r, cm) > 0) && matchFilter(u, d, meta, true);
        }
        if (K.slice === 'saldo_filter') {
          if (sh !== 'kas' || !matchFilter(u, d, meta, false)) return false;
          return N(cV(r, 'kas', 'masuk')) > 0 || N(cV(r, 'kas', 'keluar')) > 0;
        }
        if (K.slice === 'profit') {
          if (!matchFilter(u, d, meta, false)) return false;
          if (sh === 'penjualan') return !isOpenStatus(st);
          if (sh === 'ecer') return true;
          if (sh === 'kas') return N(cV(r, 'kas', 'keluar')) > 0;
          return false;
        }
        if (K.slice === 'total_penjualan') return sh === 'penjualan' && !isOpenStatus(st) && matchFilter(u, d, meta, false);
        if (K.slice === 'total_pembelian') return sh === 'pembelian' && !isOpenStatus(st) && matchFilter(u, d, meta, false);
        if (K.slice === 'kas_masuk') return sh === 'kas' && N(cV(r, 'kas', 'masuk')) > 0 && matchFilter(u, d, meta, false);
        if (K.slice === 'kas_keluar') return sh === 'kas' && N(cV(r, 'kas', 'keluar')) > 0 && matchFilter(u, d, meta, false);
        return true;
      });
    } else if (K.parent) {
      const fk = fkCol(sh);
      rows = rows.filter(({ r }) => cV(r, sh, fk) === K.parent);
    }

    if (qWords.length) {
      rows = rows.filter(({ r }) => {
        const extra = cI(sh, 'idkontak') > -1 ? resolveKontakName(cV(r, sh, 'idkontak'), km) : '';
        const text = (r.join(' ') + ' ' + extra).toLowerCase();
        return qWords.every(w => text.includes(w));
      });
    }

    const si = K.sort ? cI(sh, K.sort) : -1;
    if (si > -1) {
      rows.sort((a, b) => String(a.r[si] || '').localeCompare(String(b.r[si] || ''), 'id', { numeric: true }) * K.dir);
    } else if (K.dir === -1) {
      rows.reverse();
    }
    return rows;
  }

  function renderNavFooters() {

  function renderDash() {
    const cm = cicilMap();
    let jual = 0, beli = 0, km = 0, kk = 0, piutang = 0, cogs = 0, pot = 0, modalStok = 0, potensiStok = 0;

    (K.db.produk || []).forEach(r => {
      if (!isUserVisible(r, 'produk') || !matchFilter(cV(r, 'produk', 'user'), cV(r, 'produk', 'date'), cV(r, 'produk', 'kategori'), true)) return;
      const st = Z(cV(r, 'produk', 'stok'));
      if (st > 0) {
        modalStok += N(cV(r, 'produk', 'hargabeli')) * st;
        potensiStok += N(cV(r, 'produk', 'hargajual')) * st;
      }
    });

    (K.db.penjualan || []).forEach(r => {
      if (!isUserVisible(r, 'penjualan') || isOpenStatus(S2(cV(r, 'penjualan', 'status')))) return;
      const u = cV(r, 'penjualan', 'user'), d = cV(r, 'penjualan', 'date');
      const net = trxNet('penjualan', r), paid = paidOf('penjualan', r, cm);
      if (matchFilter(u, d, '', true)) piutang += Math.max(0, net - paid);
      if (matchFilter(u, d, '', false)) {
        const it = calcItems('penjualan', cV(r, 'penjualan', 'idpenjualan'));
        jual += net; cogs += it.cogs; pot += it.pot;
      }
    });

    (K.db.ecer || []).forEach(r => {
      if (!isUserVisible(r, 'ecer') || !matchFilter(cV(r, 'ecer', 'user'), cV(r, 'ecer', 'date'), cV(r, 'ecer', 'namaproduk'), false)) return;
      const q = N(cV(r, 'ecer', 'qty')), hb = N(cV(r, 'ecer', 'hargabeli')), hj = N(cV(r, 'ecer', 'hargajual')), disc = N(cV(r, 'ecer', 'diskon'));
      jual += Math.max(0, hj * q - disc); cogs += hb * q; pot += hj * q;
    });

    (K.db.pembelian || []).forEach(r => {
      if (!isUserVisible(r, 'pembelian') || isOpenStatus(S2(cV(r, 'pembelian', 'status')))) return;
      if (matchFilter(cV(r, 'pembelian', 'user'), cV(r, 'pembelian', 'date'), '', false)) beli += trxNet('pembelian', r);
    });

    (K.db.kas || []).forEach(r => {
      if (!isUserVisible(r, 'kas') || !matchFilter(cV(r, 'kas', 'user'), cV(r, 'kas', 'date'), `${cV(r, 'kas', 'kategori')} ${cV(r, 'kas', 'uraian')}`, false)) return;
      km += N(cV(r, 'kas', 'masuk')); kk += N(cV(r, 'kas', 'keluar'));
    });

    const profit = jual - cogs - kk;
    const saldo = km - kk;
    const cards = [
      ['Modal Stok Ready', fmtNum(modalStok), 'produk', 'ready'],
      ['Potensi Jual Ready', fmtNum(potensiStok), 'produk', 'ready'],
      ['Sisa Stok', `${fmtNum(modalStok)} / ${fmtNum(potensiStok)}`, 'produk', 'sisa_stok'],
      ['Total Piutang', fmtNum(piutang), 'penjualan', 'piutang'],
      ['Saldo Kas (Filter)', fmtNum(saldo), 'kas', 'saldo_filter'],
      ['Profit Bersih', fmtNum(profit), 'penjualan', 'profit'],
      ['Total Penjualan', fmtNum(jual), 'penjualan', 'total_penjualan'],
      ['Total Pembelian', fmtNum(beli), 'pembelian', 'total_pembelian'],
      ['Kas Masuk', fmtNum(km), 'kas', 'kas_masuk'],
      ['Kas Keluar', fmtNum(kk), 'kas', 'kas_keluar']
    ];

    dom.db.innerHTML = cards.map(([lb, vl, sh, sl]) =>
      `<button data-a="nav" data-s="${sh}" data-slice="${sl || ''}">${lb}<br><b>${vl}</b></button>`
    ).join('') +
      `<input type="date" id="df" value="${K.df}">` +
      `<input type="date" id="dt" value="${K.dt}">` +
      (isAdmin() ? `<input id="du" placeholder="filter user" value="${esc(K.du)}">` : '') +
      `<input id="dk" placeholder="filter kategori" value="${esc(K.dk)}">` +
      `<button data-a="df-today">hari ini</button>` +
      `<button data-a="df-clear">reset filter</button>`;

    renderNavFooters();
  }

    dom.fb.innerHTML = allC.map((c, idx) => {

      const ph = c === 'idkontak' && v ? `${v} (${resolveKontakName(v, km)})` : c;
      if (c === 'hide' || c === 'konten') return `<textarea data-col="${c}" data-idx="${idx}" placeholder="${ph}" ${hiddenAttr}>${esc(v)}</textarea>`;
      const type = IMG_COLS.has(c) || c === 'file' ? 'url' : NUM_COLS.has(c) ? 'number' : c === 'date' ? 'date' : c === 'jam' ? 'time' : 'text';
      const thumb = IMG_COLS.has(c) && isSafeUrl(v) ? `<img class="frm-thumb" data-for="${c}" src="${esc(v)}" style="width:100%;max-height:140px;object-fit:contain">` : '';
      return `<input data-col="${c}" data-idx="${idx}" type="${type}" placeholder="${esc(ph)}" value="${esc(v)}" ${ro} ${hiddenAttr}>${thumb}`;
    }).join('');

    if (isTrx()) {
      const id = fld(cols()[0])?.value || '';
      const { sub, itemDisc } = calcItems(K.cur, id);
      const tot = Math.max(0, sub - itemDisc - N(fld('diskon')?.value));
      const paid = N(fld('bayar')?.value) + (K.cur === 'penjualan' ? (cicilMap()[id] || 0) : 0);
      dom.fb.insertAdjacentHTML('beforeend', `<p id="trx-sum">Total: <b>${fmtNum(tot)}</b> | ${paid >= tot ? 'Kembali: ' + fmtNum(paid - tot) : 'Sisa: ' + fmtNum(tot - paid)}</p>`);
    }

    addFooter('back', '<');
    addFooter('save-row', 'save');

    allC.forEach((c, idx) => {
      const trg = resolveRef(c, idx);
      if (trg) {
        const curVal = fld(c)?.value || '';
        addFooter('ref', `ref ${trg}`, trg, `data-col="${c}" data-trg="${trg}" ${hasRefMatch(trg, curVal) ? '' : 'hidden'}`);
      }
    });

    if (K.cur === 'kontak' && K.idx >= 0) {
      const kId = S2(cV(r, 'kontak', 'idkontak'));
      if (kId) {
        if ((K.db.penjualan || []).some(x => S2(cV(x, 'penjualan', 'idkontak')) === kId)) addFooter('ref', 'ref penjualan', 'penjualan', `data-col="idkontak" data-trg="penjualan"`);
        if ((K.db.pembelian || []).some(x => S2(cV(x, 'pembelian', 'idkontak')) === kId)) addFooter('ref', 'ref pembelian', 'pembelian', `data-col="idkontak" data-trg="pembelian"`);
      }
    }

    if (K.idx >= 0) { addFooter('del-row', 'del'); addFooter('dup-row', 'dup'); }
    if (K.cur === 'produk_jual' || K.cur === 'produk_beli') addFooter('edit-prod', 'produk', 'produk');
    if (K.cur === 'produk' && K.idx >= 0) {
      addFooter('jual-prod', 'jual', 'produk_jual');
      addFooter('beli-prod', 'beli', 'produk_beli');
      addFooter('ecer-prod', 'ecer', 'ecer');
    }
    if (isTrx()) {
      const id = fld(cols()[0])?.value || '';
      const st = S2(fld('status')?.value);
      addFooter('trx-pick-kontak', 'kontak', 'kontak');
      addFooter('pay-pas', 'pas');
      if (st === 'lunas' || st === 'piutang') addFooter('revisi', 'revisi');
      if (K.cur === 'penjualan' && st === 'piutang') addFooter('cicil', 'cicil', 'cicil');
      if (K.idx >= 0) addFooter('trx-rincian', 'rincian', childOf(K.cur));
      if (K.cur === 'penjualan' && (K.idx >= 0 || calcItems('penjualan', id).items.length)) addFooter('show-nota', 'nota', 'penjualan');
    }
    if (allC.some(c => IMG_COLS.has(c))) { addFooter('cam', 'cam'); addFooter('pic', 'pic'); addFooter('gimg', 'gimg'); }
    if (allC.includes('file')) addFooter('doc-upload', 'file');
    if (allC.includes('lokasi')) { addFooter('gps', 'gps'); addFooter('navigasi', 'navigasi'); }
  }

  function renderList(isBulkEdit = false) {
    const rows = queryRows();
    const sh = K.cur, showCols = vis(), km = kontakMap(), cm = cicilMap();
    const imgI = cols().findIndex(c => IMG_COLS.has(S2(c)));

    dom.ls.innerHTML = rows.slice(0, K.lim).map(({ r, i }) => {
      if (isBulkEdit) {
        return `<div contenteditable="true" data-i="${i}">${esc(r.join(' | '))}</div>`;
      }
      const img = imgI > -1 && isSafeUrl(r[imgI]) ? `<img src="${esc(r[imgI])}" loading="lazy">` : '';
      let txt = showCols.map(c => {
        const val = cV(r, sh, c);
        if (!val) return '';
        if (S2(c) === 'idkontak') return resolveKontakName(val, km);
        return NUM_COLS.has(S2(c)) ? fmtNum(val) : val;
      }).filter(Boolean).join(' - ');

      if (isTrx(sh)) {
        const net = trxNet(sh, r), paid = paidOf(sh, r, cm);
        txt += ` | Total: ${fmtNum(net)}`;
        if (paid < net && !isOpenStatus(S2(cV(r, sh, 'status')))) txt += ` (Sisa: ${fmtNum(net - paid)})`;
      }
      if (sh === 'produk' && K.slice === 'sisa_stok') {
        const pid = S2(cV(r, 'produk', 'idproduk'));
        const terjual = (K.db.produk_jual || []).reduce((sum, x) => S2(cV(x, 'produk_jual', 'idproduk')) === pid ? sum + N(cV(x, 'produk_jual', 'qty')) : sum, 0);
        const sisa = Z(cV(r, 'produk', 'stok'));
        txt = `${cV(r, 'produk', 'namaproduk')} | Terjual: ${fmtNum(terjual)} | Sisa: ${fmtNum(sisa)}`;
      }
      return `<div data-a="row" data-i="${i}">${img}<span>${esc(txt || r[0] || '-')}</span></div>`;
    }).join('');

    if (isBulkEdit) {
      addFooter('back', '<');
      addFooter('save-bulk', 'save');
      return;
    }

    if (K.ret || K.parent || K.slice) addFooter('back', '<');
    if (rows.length > K.lim) addFooter('more', `more (${rows.length - K.lim})`);

    if (K.parent && (sh === 'produk_jual' || sh === 'produk_beli')) {
      const pt = parentOf(sh);
      const pRow = (K.db[pt] || []).find(r => cV(r, pt, cols(pt)[0]) === K.parent);
      const open = pRow && isOpenStatus(S2(cV(pRow, pt, 'status')));
      const tot = calcItems(pt, K.parent).net;
      if (open) {
        addFooter('v-shop', '+ produk', 'produk');
        addFooter('add-cart-item', '+ manual', sh);
        addFooter('clear-items', 'batal', pt);
        addFooter('v-selesai', `${pt} (${fmtNum(tot)})`, pt);
      } else {
        addFooter('v-selesai', `buka ${pt} (${fmtNum(tot)})`, pt);
      }
    } else if (!K.ret) {
      renderNavFooters();
    }
  }

  function renderNota() {
    dom.tp.textContent = formatNota(K.notaId);
    addFooter('back', '<');
    addFooter('rawbt', 'rawbt', 'penjualan');
    addFooter('jpg', 'jpg', 'penjualan');
    addFooter('print', 'print', 'penjualan');
  }

  /* ---------------- Persistensi Debounced ---------------- */
  function persist(immediate = false) {
    const flush = () => {
      try {
        const { db: _d, ver: _v, ret: _r, prefill: _p, ...state } = K;
        L.apex = JSON.stringify(state);
      } catch {}
      idbPut(K.db, 'apex_matrix');
    };
    if (immediate) { clearTimeout(persistDebounce); flush(); return; }
    clearTimeout(persistDebounce);
    persistDebounce = setTimeout(flush, 100);
  }

  /* ---------------- Render Utama ---------------- */
  function render() {
    if (K.v !== 'cms_detail' && K.v !== 'form') K.idx = null;
    const isForm = !K.u || K.idx !== null || K.v === 'cms_detail';
    const isMenu = K.v === 'menu';
    const isDash = K.u && !isForm && !isMenu && K.v === 'dash';
    const isNota = K.u && !isForm && !isMenu && K.v === 'nota';
    const isBulkEdit = K.u && !isForm && !isMenu && K.v === 'edit';
    const isList = K.u && !isForm && !isMenu && !isDash && !isNota;

    document.body.dataset.grid = isList && K.grid ? '1' : '0';
    dom.tools.hidden = !isList || isBulkEdit;
    dom.fb.hidden = !isForm;
    dom.db.hidden = !isDash;
    dom.nb.hidden = !isNota;
    dom.ls.hidden = !isList;
    dom.ft.innerHTML = '';

    if (isList) renderChrome();

    if (isMenu) {
      addFooter('back', '<');
      addFooter('theme', `theme: ${getTheme()}`);
      addFooter('reset-db', 'reset db');
      addFooter('logout', `logout (${K.u})`);
    } else if (isForm) renderForm();
    else if (isDash) renderDash();
    else if (isNota) renderNota();
    else renderList(isBulkEdit);

    persist();
  }

  /* ---------------- Aksi Pengguna ---------------- */
  const actions = {
    closemsg: () => msg(''),
    scan: () => startScan(),
    'stop-scan': () => stopScan(),
    refresh: () => syn(true),

    login: () => {
      const u = $('lu')?.value.trim() || '', p = $('lp')?.value.trim() || '';
      const users = K.db.users || [];
      if (!users.length) {
        K.db.users = [userRow(u || 'admin', 'admin', p)];
        save(K.db.users[0], 'users');
        K.u = u || 'admin'; setView('dash'); render(); syn(true); return;
      }
      const f = users.find(r => S2(cV(r, 'users', 'user')) === S2(u) && String(r[pwCol()] || '') === p);
      if (!f) return msg('login gagal');
      K.u = cV(f, 'users', 'user'); setView('dash'); render(); syn(true);
    },

    reg: () => {
      const u = $('lu')?.value.trim() || '', p = $('lp')?.value.trim() || '';
      if (!u) return msg('isi user');
      if ((K.db.users || []).some(r => S2(cV(r, 'users', 'user')) === S2(u))) return msg('user ada');
      const row = userRow(u, (K.db.users || []).length ? 'kasir' : 'admin', p);
      (K.db.users = K.db.users || []).push(row);
      save(row, 'users');
      msg('registered');
    },

    bypass: () => {
      const users = K.db.users || [];
      const adm = users.find(r => S2(cV(r, 'users', 'role')) === 'admin') || users[0];
      if (adm) K.u = cV(adm, 'users', 'user');
      else {
        const row = userRow('admin', 'admin', '');
        (K.db.users = K.db.users || []).push(row);
        save(row, 'users');
        K.u = 'admin';
      }
      setView('dash'); render(); syn(true);
    },

    back: () => {
      stopScan();
      if (K.v === 'menu') { setView(K.prevV || 'dash'); return render(); }
      if (K.ret) {
        const r = K.ret; K.ret = null;
        K.cur = r.cur; K.parent = r.parent; K.prefill = r.form;
        setView('form', r.idx); return render();
      }
      if (K.v === 'cms_detail') { setView('list'); return render(); }
      if (K.v === 'edit') { setView('list'); return render(); }
      if (K.idx !== null) {
        setView(K.parent ? 'list' : K.cur === 'kas' && !K.slice ? 'dash' : 'list');
        return render();
      }
      if (K.parent) {
        const pt = parentOf(K.cur), id = K.parent;
        K.parent = ''; K.cur = pt;
        const pi = (K.db[pt] || []).findIndex(r => cV(r, pt, cols(pt)[0]) === id);
        setView(pi > -1 ? 'form' : 'list', pi > -1 ? pi : null);
        return render();
      }
      if (K.slice) { K.slice = ''; setView('dash'); return render(); }
      setView('dash'); render();
    },

    menu: () => { if (K.v !== 'menu') K.prevV = K.v; setView(K.v === 'menu' ? (K.prevV || 'dash') : 'menu'); render(); },
    theme: () => { applyTheme(getTheme() === 'dark' ? 'light' : 'dark'); render(); },
    'df-today': () => { K.df = K.dt = today(); render(); },
    'df-clear': () => { K.df = K.dt = K.du = K.dk = ''; render(); },

    'v-dash': () => { K.parent = ''; K.ret = null; setView('dash'); render(); },
    'v-kas': () => { K.cur = 'kas'; K.parent = ''; K.ret = null; setView('form', -1); render(); },
    'v-shop': () => { K.cur = 'produk'; K.grid = 1; K.lim = 25; K.ret = null; setView('list'); render(); },
    'v-jual': () => {
      const open = getOpenTrx('penjualan');
      K.cur = 'produk_jual'; K.grid = 0; K.parent = open ? cV(open, 'penjualan', 'idpenjualan') : '__empty__';
      setView('list'); render();
    },
    'v-beli': () => {
      const open = getOpenTrx('pembelian');
      K.cur = 'produk_beli'; K.grid = 0; K.parent = open ? cV(open, 'pembelian', 'idpembelian') : '__empty__';
      setView('list'); render();
    },
    'v-selesai': () => {
      const pt = parentOf(K.cur), id = K.parent;
      K.parent = ''; K.cur = pt;
      const idx = (K.db[pt] || []).findIndex(r => cV(r, pt, cols(pt)[0]) === id);
      setView('form', idx > -1 ? idx : -1); render();
    },
    'clear-items': () => {
      const pt = parentOf(K.cur), id = K.parent;
      dropTrxDeps(pt, id);
      dropRows(pt, r => cV(r, pt, cols(pt)[0]) === id);
      K.parent = ''; K.cur = 'produk'; K.grid = 1;
      setView('list'); render(); msg('transaksi dihapus');
    },
    'add-cart-item': () => {
      const fk = fkCol(K.cur);
      K.prefill = { [fk]: K.parent, qty: '1' };
      setView('form', -1); render();
    },
    'edit-cms': () => { setView('form', K.idx); render(); },
    'dl-cms-file': () => {
      const r = (K.db.cms || [])[K.idx] || [];
      const u = cV(r, 'cms', 'file');
      if (isSafeUrl(u)) dl(u, (cV(r, 'cms', 'judul') || 'lampiran').replace(/[^a-z0-9_-]/gi, '_'));
    },

    nav: b => {
      K.cur = b.dataset.s; K.slice = b.dataset.slice || ''; K.parent = ''; K.grid = 0; K.lim = 25;
      setView('list'); render();
    },

    add: () => {
      if (!K.u) return;
      K.ret = null;
      if (K.cur === 'produk_jual' || K.cur === 'produk_beli') {
        const pt = parentOf(K.cur), open = getOpenTrx(pt);
        if (!open) { K.cur = 'produk'; K.grid = 1; setView('list'); return render(); }
        K.prefill = { [fkCol(K.cur)]: cV(open, pt, cols(pt)[0]), qty: '1' };
      }
      setView('form', -1); render();
    },

    'edit-prod': () => {
      const pid = fld('idproduk')?.value || '';
      const idx = (K.db.produk || []).findIndex(r => cV(r, 'produk', 'idproduk') === pid);
      if (idx === -1) return msg('produk tidak ditemukan');
      K.ret = { cur: K.cur, idx: K.idx, parent: K.parent, form: formState(), col: '' };
      K.cur = 'produk'; setView('form', idx); render();
    },

    'jual-prod': () => prodTo('produk_jual'),
    'beli-prod': () => prodTo('produk_beli'),
    'ecer-prod': () => prodTo('ecer'),

    'save-row': () => {
      const rules = getRoleRules();
      if (rules.has('wajibabsen') && K.cur !== 'absen') {
        const sudahAbsen = (K.db.absen || []).some(r => S2(cV(r, 'absen', 'user')) === S2(K.u) && cV(r, 'absen', 'date') === today());
        if (!sudahAbsen) return msg('Wajib absen hari ini terlebih dahulu!');
      }
      if (rules.has('wajiblokasi') && cols().includes('lokasi') && !(fld('lokasi')?.value || '').trim()) return msg('Kolom lokasi wajib diisi!');
      if (rules.has('wajibfoto') && cols().includes('foto') && !(fld('foto')?.value || '').trim()) return msg('Kolom foto wajib diisi!');

      if ((K.cur === 'produk_jual' || K.cur === 'ecer') && rules.has('wajibstok')) {
        const pid = fld('idproduk')?.value || '', pnm = fld('namaproduk')?.value || '';
        const newQ = N(fld('qty')?.value);
        const oldQ = K.idx >= 0 ? N(cV((K.db[K.cur] || [])[K.idx], K.cur, 'qty')) : 0;
        const prod = (K.db.produk || []).find(p => (pid && S2(cV(p, 'produk', 'idproduk')) === S2(pid)) || (pnm && S2(cV(p, 'produk', 'namaproduk')) === S2(pnm)));
        if (!prod || Z(cV(prod, 'produk', 'stok')) + oldQ < newQ) return msg('Stok tidak mencukupi!');
      }

      if (isTrx()) {
        const id = fld(cols()[0])?.value || '';
        const { items, net } = calcItems(K.cur, id);
        if (!items.length) return msg('Belum ada item barang!');
        const tot = Math.max(0, net - N(fld('diskon')?.value));
        const paid = N(fld('bayar')?.value) + (K.cur === 'penjualan' ? (cicilMap()[id] || 0) : 0);
        const kId = fld('idkontak')?.value || '';
        const stFld = fld('status');
        const nextSt = statusFor(tot, paid, kId);
        if (nextSt === 'draft' && paid < tot && !kId) return msg('Pembayaran kurang! Isi kontak untuk piutang atau lunasi bayar.');
        if (rules.has('wajibkontak') && !kId) return msg('Kolom kontak wajib diisi!');
        if (stFld) stFld.value = nextSt;
      }

      const row = cols().map(c => fld(c)?.value || '');
      if (!row[0]) return msg('kolom 1 wajib');

      if (K.cur === 'skema') {
        const targetSh = S2(row[0]);
        if (!targetSh) return msg('Nama sheet wajib diisi');
        row[0] = targetSh;
        row[1] = String(row[1] || '').split(',').map(S2).filter(Boolean).join(',');
        if (!row[1]) return msg('Daftar cols wajib diisi');
        row[2] = String(row[2] || '').split(',').map(S2).filter(Boolean).join(',') || row[1].split(',').slice(0, 4).join(',');
        row[3] = String(row[3] || '').split(',').map(S2).filter(Boolean).join(',') || row[1];
      }

      const old = K.idx >= 0 ? [...(K.db[K.cur] || [])[K.idx]] : null;
      if (K.idx >= 0) K.db[K.cur][K.idx] = row;
      else (K.db[K.cur] = K.db[K.cur] || []).push(row);

      if (K.cur === 'skema') applySchemaTable();

      syncStockDelta(K.cur, old, row);
      save(row);
      msg('saved');

      if (K.cur === 'produk_jual' || K.cur === 'produk_beli') {
        const pt = parentOf(K.cur);
        const fk = fkCol(K.cur);
        syncTrx(pt);
        K.parent = cV(row, K.cur, fk);
        setView('list'); return render();
      }
      if (K.cur === 'cicil') syncTrx('penjualan');
      if (K.cur === 'penjualan' && S2(cV(row, 'penjualan', 'status')) !== 'draft') {
        K.notaId = cV(row, 'penjualan', 'idpenjualan');
        setView('nota'); return render();
      }
      if (K.ret) {
        const r = K.ret; K.ret = null;
        if (r.col) r.form[r.col] = row[0];
        K.cur = r.cur; K.parent = r.parent; K.prefill = r.form;
        setView('form', r.idx); return render();
      }
      setView(K.cur === 'kas' && !K.slice ? 'dash' : 'list'); render();
    },

    'del-row': b => {
      if (b.textContent !== 'sure?') { b.textContent = 'sure?'; return; }
      const r = (K.db[K.cur] || [])[K.idx];
      if (r) {
        if (K.cur === 'skema') {
          const delSheet = S2(r[0]);
          if (HARD.shs.includes(delSheet)) return msg('Tabel inti tidak dapat dihapus');
          K.db.skema.splice(K.idx, 1);
          save(r, 'skema', 0);
          save([delSheet], delSheet, -1);
          applySchemaTable();
          setView('list'); render(); msg('deleted'); return;
        }
        syncStockDelta(K.cur, r, null);
        if (isTrx()) dropTrxDeps(K.cur, cV(r, K.cur, cols()[0]));
        K.db[K.cur].splice(K.idx, 1);
        save(r, K.cur, 0);
        if (K.cur === 'produk_jual' || K.cur === 'produk_beli') syncTrx(parentOf(K.cur));
        if (K.cur === 'cicil') syncTrx('penjualan');
      }
      setView(K.parent ? 'list' : K.cur === 'kas' && !K.slice ? 'dash' : 'list'); render(); msg('deleted');
    },

    'dup-row': () => {
      const r = [...((K.db[K.cur] || [])[K.idx] || [])];
      if (!r.length) return;
      if (!['users', 'roles', 'skema'].includes(K.cur)) r[0] = genId();
      if (cI(K.cur, 'status') > -1 && isTrx()) r[cI(K.cur, 'status')] = 'draft';
      (K.db[K.cur] = K.db[K.cur] || []).push(r);
      syncStockDelta(K.cur, null, r);
      save(r);
      setView('form', K.db[K.cur].length - 1); render(); msg('duplicated');
    },

    'trx-pick-kontak': () => {
      K.ret = { cur: K.cur, idx: K.idx, parent: K.parent, form: formState(), col: 'idkontak' };
      K.cur = 'kontak'; K.parent = ''; K.slice = ''; dom.q.value = '';
      setView('list'); render();
    },

    'pay-pas': () => {
      const id = fld(cols()[0])?.value || '';
      const tot = Math.max(0, calcItems(K.cur, id).net - N(fld('diskon')?.value));
      const cicil = K.cur === 'penjualan' ? (cicilMap()[id] || 0) : 0;
      const b = fld('bayar');
      if (b) { b.value = String(Math.max(0, tot - cicil)); b.dispatchEvent(new Event('input', { bubbles: true })); }
    },

    revisi: () => {
      const st = fld('status');
      if (st) st.value = 'revisi';
      const id = fld(cols()[0])?.value || '';
      const r = (K.db[K.cur] || [])[K.idx];
      if (r && cI(K.cur, 'status') > -1) { r[cI(K.cur, 'status')] = 'revisi'; save(r); }
      K.parent = id; K.cur = childOf(K.cur); setView('list'); render();
    },

    cicil: () => {
      const id = fld('idpenjualan')?.value || '';
      const kId = fld('idkontak')?.value || '';
      const fk = fkCol('cicil');
      K.cur = 'cicil'; K.prefill = { idcicil: genId(), [fk]: id, user: K.u, date: today(), idkontak: kId };
      setView('form', -1); render();
    },

    'trx-rincian': () => {
      K.parent = fld(cols()[0])?.value || '';
      K.cur = childOf(K.cur); setView('list'); render();
    },

    'show-nota': () => { K.notaId = fld('idpenjualan')?.value || ''; setView('nota'); render(); },

    rawbt: () => { location.href = 'rawbt:base64,' + btoa(unescape(encodeURIComponent(dom.tp.textContent))); },

    jpg: () => {
      const lines = dom.tp.textContent.split('\n');
      const cv = document.createElement('canvas'), ctx = cv.getContext('2d');
      cv.width = 384; cv.height = lines.length * 22 + 30;
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = '#000'; ctx.font = '15px monospace';
      lines.forEach((l, i) => ctx.fillText(l, 12, 24 + i * 22));
      cv.toBlob(b => {
        if (!b) return;
        try { navigator.clipboard.write([new ClipboardItem({ 'image/png': b })]).then(() => msg('copied')).catch(() => dl(b, `nota-${K.notaId || 'trx'}.png`)); }
        catch { dl(b, `nota-${K.notaId || 'trx'}.png`); }
      });
    },

    print: () => W.print(),

    'reset-db': () => {
      idbClearStore('kv'); idbClearStore('mut'); L.removeItem('apex');
      K.db = structuredClone(HARD.db); K.ver = {};
      applySchemaTable();
      setView('dash'); render(); syn(true);
    },

    'save-bulk': () => {
      dom.ls.querySelectorAll('[data-i]').forEach(el => {
        const idx = Number(el.dataset.i);
        const vals = el.textContent.split('|').map(s => s.trim());
        if (K.db[K.cur]?.[idx]) {
          K.db[K.cur][idx] = cols().map((_, ci) => vals[ci] ?? '');
          save(K.db[K.cur][idx]);
        }
      });
      if (K.cur === 'skema') applySchemaTable();
      setView('list'); render(); msg('saved');
    },

    grid: () => { K.grid = K.grid ? 0 : 1; render(); },
    dir: () => { K.dir *= -1; render(); },
    more: () => { K.lim += 25; render(); },
    logout: () => { K.u = ''; setView('dash'); render(); },

    cam: () => { dom.fCam.value = ''; dom.fCam.click(); },
    pic: () => { dom.fImg.value = ''; dom.fImg.click(); },
    'doc-upload': () => { dom.fDoc.value = ''; dom.fDoc.click(); },

    gimg: () => {
      const q = fld('namaproduk')?.value || fld('nama')?.value || fld('judul')?.value || fld(cols()[1])?.value || '';
      W.open(`https://www.google.com/search?tbm=isch&q=${encodeURIComponent(q)}`, '_blank', 'noopener,noreferrer');
    },

    navigasi: () => {
      const v = fld('lokasi')?.value || '';
      if (v) W.open(/^https?:\/\//i.test(v) ? v : `https://maps.google.com/?q=${encodeURIComponent(v)}`, '_blank', 'noopener,noreferrer');
    },

    gps: () => {
      const inp = fld('lokasi');
      if (!inp) return;
      msg('mencari gps...');
      navigator.geolocation?.getCurrentPosition(
        p => { inp.value = `${p.coords.latitude.toFixed(6)},${p.coords.longitude.toFixed(6)}`; msg(''); },
        () => msg('gps gagal'),
        { enableHighAccuracy: true, timeout: 10000 }
      );
    },

    'sh-sel': el => { K.cur = el.value; K.parent = ''; K.slice = ''; K.lim = 25; render(); },
    'st-sel': el => { K.sort = el.value; render(); },
    'act-sel': el => {
      const v = el.value; el.value = '';
      if (v === 'edit') { setView('edit'); render(); }
      else if (v === 'tsv') {
        const tsv = [cols().join('\t'), ...queryRows().map(x => x.r.join('\t'))].join('\n');
        dl(tsv, `${K.cur}.tsv`, 'text/tab-separated-values;charset=utf-8');
      } else if (v === 'imp') { dom.fImp.value = ''; dom.fImp.click(); }
      else if (v === 'clear') {
        if (!hasAccess('del-row')) return msg('Akses ditolak');
        const rows = queryRows();
        const delSet = new Set(rows.map(x => x.i));
        K.db[K.cur] = (K.db[K.cur] || []).filter((r, i) => {
          if (delSet.has(i)) { syncStockDelta(K.cur, r, null); save(r, K.cur, 0); return false; }
          return true;
        });
        render(); msg(`cleared ${rows.length}`);
      }
    }
  };

  /* ---------------- Event Listeners Terpadu ---------------- */
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-a]');
    if (!b) return;
    const a = b.dataset.a;
    if (!hasAccess(a)) return msg('Akses ditolak');

    if (a === 'ref') {
      const trg = b.dataset.trg, cName = b.dataset.col;
      const curVal = fld(cName)?.value || '';
      K.ret = { cur: K.cur, idx: K.idx, parent: K.parent, form: formState(), col: cName };
      K.cur = trg; K.parent = ''; K.slice = ''; dom.q.value = curVal;
      setView('list'); return render();
    }

    if (a === 'row') {
      const idx = Number(b.dataset.i);
      const r = (K.db[K.cur] || [])[idx];
      if (!r) return;
      if (K.ret) {
        const ret = K.ret; K.ret = null;
        if (ret.col) ret.form[ret.col] = r[0] || '';
        K.cur = ret.cur; K.parent = ret.parent; K.prefill = ret.form;
        setView('form', ret.idx); return render();
      }
      if (K.cur === 'produk' && !isAdmin()) return openProdForm(r);
      if (K.cur === 'produk' && isAdmin() && (hasDraftItems('penjualan') || hasDraftItems('pembelian'))) return openProdForm(r);
      if (K.cur === 'cms') { setView('cms_detail', idx); return render(); }
      setView('form', idx); return render();
    }

    actions[a]?.(b);
  });

  document.addEventListener('change', e => {
    const el = e.target.closest('[data-a]');
    if (el) return actions[el.dataset.a]?.(el);
    if (e.target.id === 'df') { K.df = e.target.value; render(); }
    if (e.target.id === 'dt') { K.dt = e.target.value; render(); }
  });

  document.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'q') { K.lim = 25; render(); return; }
    if (t.id === 'du') { K.du = t.value; render(); return; }
    if (t.id === 'dk') { K.dk = t.value; render(); return; }
    if (!dom.fb.contains(t) || !t.dataset.col) return;

    const cName = t.dataset.col;
    if (isTrx() && (cName === 'diskon' || cName === 'bayar')) {
      const id = fld(cols()[0])?.value || '';
      const tot = Math.max(0, calcItems(K.cur, id).net - N(fld('diskon')?.value));
      const paid = N(fld('bayar')?.value) + (K.cur === 'penjualan' ? (cicilMap()[id] || 0) : 0);
      const sumEl = $('trx-sum');
      if (sumEl) sumEl.innerHTML = `Total: <b>${fmtNum(tot)}</b> | ${paid >= tot ? 'Kembali: ' + fmtNum(paid - tot) : 'Sisa: ' + fmtNum(tot - paid)}`;
    }

    if ((K.cur === 'produk_jual' || K.cur === 'produk_beli' || K.cur === 'ecer') && (cName === 'idproduk' || cName === 'namaproduk')) {
      const v = S2(t.value);
      const f = v && (K.db.produk || []).find(p => S2(cV(p, 'produk', cName)) === v);
      if (f) flds().forEach(inp => { const fi = cI('produk', inp.dataset.col); if (fi !== -1) inp.value = f[fi] || ''; });
    }

    if (IMG_COLS.has(cName)) {
      const oldThumb = dom.fb.querySelector(`.frm-thumb[data-for="${cName}"]`);
      if (isSafeUrl(t.value)) {
        if (oldThumb) oldThumb.src = t.value;
        else t.insertAdjacentHTML('afterend', `<img class="frm-thumb" data-for="${cName}" src="${esc(t.value)}" style="width:100%;max-height:140px;object-fit:contain">`);
      } else oldThumb?.remove();
    }

    refreshRefButtons();
  });

  function readFile(file, mode, cb) {
    if (!file) return;
    const fr = new FileReader();
    fr.onload = () => cb(fr.result);
    mode === 'text' ? fr.readAsText(file) : fr.readAsDataURL(file);
  }

  function compressImg(file, cb) {
    readFile(file, 'url', raw => {
      const img = new Image();
      img.onload = () => {
        const maxW = 480, scale = img.width > maxW ? maxW / img.width : 1;
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * scale);
        cv.height = Math.round(img.height * scale);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        cb(cv.toDataURL('image/jpeg', 0.65));
      };
      img.onerror = () => cb(raw);
      img.src = raw;
    });
  }

  function importText(text) {
    const lines = String(text || '').split(/\r?\n/).filter(Boolean);
    if (!lines.length) return;
    const sep = lines[0].includes('\t') ? '\t' : ',';
    const splitLine = l => l.split(sep).map(s => s.trim().replace(/^"|"$/g, ''));
    const hdr = splitLine(lines[0]).map(S2);
    const tCols = cols();
    const hasHdr = hdr.some(h => tCols.map(S2).includes(h));
    const startIdx = hasHdr ? 1 : 0;
    const colMap = hasHdr ? tCols.map(c => hdr.indexOf(S2(c))) : tCols.map((_, i) => i);
    let count = 0;
    for (let i = startIdx; i < lines.length; i++) {
      const raw = splitLine(lines[i]);
      const row = colMap.map((mi, ci) => (mi > -1 ? raw[mi] : '') || (ci === 0 && !['users', 'roles', 'skema'].includes(K.cur) ? genId() : ''));
      if (!row[0]) continue;
      (K.db[K.cur] = K.db[K.cur] || []).push(row);
      syncStockDelta(K.cur, null, row);
      save(row);
      count++;
    }
    if (K.cur === 'skema') applySchemaTable();
    render();
    msg(`imported ${count}`);
  }

  const onImg = e => compressImg(e.target.files[0], u => {
    const inp = fld('foto') || fldBy(/foto|gambar|img|image/i);
    if (inp) { inp.value = u; inp.dispatchEvent(new Event('input', { bubbles: true })); }
  });
  dom.fCam.onchange = onImg;
  dom.fImg.onchange = onImg;
  dom.fDoc.onchange = e => readFile(e.target.files[0], 'url', u => { const inp = fld('file'); if (inp) inp.value = u; });
  dom.fImp.onchange = e => readFile(e.target.files[0], 'text', importText);

  W.addEventListener('online', () => { clearTimeout(syncDebounce); syncDebounce = setTimeout(() => syn(false), 300); });
  W.addEventListener('pagehide', () => persist(true));

  if ('serviceWorker' in navigator && /^https?:$/i.test(location.protocol)) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
  navigator.storage?.persist?.().catch(() => {});

  /* ---------------- Boot Aplikasi ---------------- */
  initDB(async () => {
    const m = await idbGet('apex_matrix');
    if (m && typeof m === 'object') Object.assign(K.db, m);
    applySchemaTable();
    render();
    syn(false);
  });
  </script>
</body>
