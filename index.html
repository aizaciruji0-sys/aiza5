  /* State & Helpers */

  const K = { u: L.u || '', cur: 'penjualan', v: 'dash', idx: null, page: 1, sort: 0, dir: 1, grid: false, conf: null, prefill: null, parent: null, receiptRaw: '', prodIdx: null, slice: '', df: { u: '', from: '', to: '', kat: '' }, shs: [...HARD.shs], cols: JSON.parse(JSON.stringify(HARD.cols)), vis: JSON.parse(JSON.stringify(HARD.vis)), fvis: {}, db: JSON.parse(JSON.stringify(HARD.db)), ret: null, prev: null, writing: false };

  function applySchemaTable() {

  const S2 = s => String(s || '').trim().toLowerCase();

          if (pRow && need > Z(cV(pRow, 'produk', 'stok'))) return msg('stok kurang');
        }

        const pType = parentOf(K.cur);
        if (pType && K.idx === -1) {
          if (!K.parent || K.parent.type !== pType) K.parent = getOpenTrx(pType) || { type: pType, id: genId(), open: true };
          if (!(K.db[pType] || []).some(r => S2(trxIdOf(pType, r)) === S2(K.parent.id))) {
            const pCols = cols(pType), newP = new Array(pCols.length).fill('');

            pCols.forEach((col, i) => { if (/date|tanggal/i.test(col)) newP[i] = today(); else if (col === 'user') newP[i] = K.u || 'admin'; else if (col === 'status') newP[i] = 'draft'; });
            (K.db[pType] = K.db[pType] || []).push(newP); save(newP, pType, 2);

          if (sI > -1) row[sI] = statusFor(net, paid, kId);
          if ((row[sI] === 'piutang' || (net > 0 && paid < net)) && cI(K.cur, 'idkontak') !== -1 && !kId) return msg('piutang butuh kontak');
        }

        if (K.idx === -1) { syncMasterProduk(K.cur, null, row); (K.db[K.cur] = K.db[K.cur] || []).push(row); save(row, K.cur, 2); }
        else if (K.idx >= 0) { syncMasterProduk(K.cur, oldRow, row); if (oldRow && oldRow[0] !== row[0]) save(oldRow, K.cur, 0); K.db[K.cur][K.idx] = row; save(row, K.cur, 1); }
        if (K.cur === 'skema') { if (oldRow?.[0] && oldRow[0] !== row[0] && !HARD.shs.includes(S2(oldRow[0]))) save([S2(oldRow[0])], S2(oldRow[0]), -1); applySchemaTable(); syn(true); }

        render();
      } finally { K.writing = false; }
    },

    'del-row': () => {
      if (K.conf !== 'del') { K.conf = 'del'; return render(); }
      const target = K.idx >= 0 ? K.db[K.cur][K.idx] : null; if (!target) return;
      const id = isTrx() ? trxIdOf(K.cur, target) : target[0], pType = parentOf(K.cur), pid = pType ? (target[cI(K.cur, fkCol(K.cur))] || K.parent?.id) : null, delCicilJual = K.cur === 'cicil' ? cV(target, 'cicil', 'idpenjualan') : null;
      K.idx = null; dropRows(K.cur, r => r === target);
      if (K.cur === 'skema') { const droppedSh = S2(id); if (droppedSh && !HARD.shs.includes(droppedSh)) save([droppedSh], droppedSh, -1); applySchemaTable(); syn(true); }
      if (isTrx() && id) dropTrxDeps(K.cur, id);

    'trx-pick-kontak': () => { if (!K.shs.includes('kontak')) return; K.ret = { cur: K.cur, idx: K.idx, parent: K.parent, form: formState(), col: 'idkontak' }; K.cur = 'kontak'; setView('list', null); dom.q.value = ''; K.page = 1; render(); },
    'pay-pas': () => { const r = K.idx >= 0 ? K.db[K.cur][K.idx] : null, pid = r ? trxIdOf(K.cur, r) : (fld(cols()[0])?.value || ''), bayar = fld('bayar'); if (bayar && pid) { const { raw, disc } = calcItems(K.cur, pid); bayar.value = String(Math.max(0, raw - disc - N(fld('diskon')?.value || (r ? cV(r, K.cur, 'diskon') : 0)))); } },
    revisi: () => { if (!(K.idx >= 0)) return; const r = K.db[K.cur][K.idx], pid = trxIdOf(K.cur, r); if (!pid) return; K.parent = { type: K.cur, id: pid, open: true }; const sI = cI(K.cur, 'status'); if (sI !== -1) { r[sI] = 'revisi'; save(r, K.cur, 1); persist(); } K.cur = childOf(K.cur); setView('list', null); render(); },
    cicil: () => { if (!(K.idx >= 0)) return; const r = K.db[K.cur][K.idx], pid = trxIdOf('penjualan', r); if (!pid) return; if (!K.shs.includes('cicil')) K.shs.push('cicil'); const rem = Math.max(0, trxNet('penjualan', r) - paidOf('penjualan', r)); K.cur = 'cicil'; K.prefill = { idpenjualan: pid, idkontak: cV(r, 'penjualan', 'idkontak'), date: today(), user: K.u || 'admin', jumlah: rem > 0 ? String(rem) : '' }; setView('form', -1); render(); },
    'trx-rincian': () => { if (!(K.idx >= 0)) return; const pid = trxIdOf(K.cur, K.db[K.cur][K.idx]); if (pid) { K.parent = { type: K.cur, id: pid, open: true }; K.cur = childOf(K.cur); setView('list', null); render(); } },
    'show-nota': () => { const pid = (K.cur === 'penjualan' && K.idx >= 0) ? trxIdOf('penjualan', K.db.penjualan[K.idx]) : (K.parent?.type === 'penjualan' ? K.parent.id : trxIdOf('penjualan', K.db.penjualan?.[0])); if (pid) { K.receiptRaw = formatNota(pid); setView('nota', null); render(); } },
    rawbt: () => { if (!K.receiptRaw) return; const u = encodeURIComponent(K.receiptRaw.trim() + '\r\n\r\n\r\n'); W.location.href = /Android/i.test(navigator.userAgent) ? `intent:${u}#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;` : `rawbt:${u}`; },
    jpg: () => {
      if (!K.receiptRaw) return;
      const lines = K.receiptRaw.split(/\r?\n/), lh = 18, font = '13px monospace', mctx = document.createElement('canvas').getContext('2d'); mctx.font = font;
      const w = Math.ceil(Math.max(0, ...lines.map(l => mctx.measureText(l).width))) || 280, h = lines.length * lh + 4, can = document.createElement('canvas'); can.width = w; can.height = h;
      const ctx = can.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.fillStyle = '#000'; ctx.font = font; ctx.textBaseline = 'top';

      can.toBlob(blob => { if (!blob) return; const dlPng = () => { const u = URL.createObjectURL(blob), a = document.createElement('a'); a.href = u; a.download = `nota_${Date.now()}.png`; document.body.appendChild(a); a.click(); setTimeout(() => { a.remove(); URL.revokeObjectURL(u); }, 500); }; try { navigator.clipboard && W.ClipboardItem ? navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).catch(dlPng) : dlPng(); } catch { dlPng(); } }, 'image/png');
    },
    print: () => W.print(),
    'reset-db': async () => { if (K.conf !== 'reset-db') { K.conf = 'reset-db'; return msg('reset? klik lagi'); } K.conf = null; idbClear('kv'); idbClear('mut'); K.shs.forEach(s => K.db[s] = []); applySchemaTable(); L.vs = '[]'; persist(); render(); await syn(true); render(); },
    'save-bulk': () => { const n = cols().length; dom.ls.querySelectorAll('[data-idx]').forEach(div => { const idx = parseInt(div.dataset.idx, 10); if (isNaN(idx) || !K.db[K.cur][idx]) return; const p = div.textContent.split('|').map(s => s.trim()); while (p.length < n) p.push(''); K.db[K.cur][idx] = p.slice(0, n); save(K.db[K.cur][idx], K.cur, 1); }); if (K.cur === 'skema') applySchemaTable(); persist(); syn(true); setView('list', null); render(); },

  /* Events & Boot */

      if (a.startsWith('ref-')) { const cName = b.dataset.refCol || ''; K.ret = { cur: K.cur, idx: K.idx, parent: K.parent, form: formState(), col: cName }; K.cur = a.slice(4); setView('list', null); dom.q.value = (cName ? (fld(cName)?.value || '') : '').trim(); K.page = 1; return render(); }
      if (!['del-row', 'clear-items', 'batal-trx', 'act-sel', 'reset-db'].includes(a) && K.conf) { K.conf = null; msg(); }

      setView('form', idx); render();
    }
  });

    if (t.id === 'q') { if (K.v === 'menu') { const qm = S2(t.value); dom.ft.querySelectorAll('button[data-a]').forEach(btn => btn.hidden = qm && !btn.textContent.toLowerCase().includes(qm)); } else { K.page = 1; render(); } return; }
    if (t.dataset.df) { const k = t.dataset.df, pos = t.selectionStart; K.df[k] = t.value; persist(); render(); const next = dom.db.querySelector(`[data-df="${CSS.escape(k)}"]`); if (next) { next.focus(); if (typeof pos === 'number') try { next.setSelectionRange(pos, pos); } catch {} } return; }
    if (t.dataset.col) {

  })();
