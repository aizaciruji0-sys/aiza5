  <script>
  'use strict';
  const HARD = {
    d1Url: 'https://aiza5.aizaciruji0.workers.dev',
    gasUrl: 'https://script.google.com/macros/s/AKfycbzaLGQzwe3hoGekhRpMXgg3KOFA2YCdW5jvu5AY4LEoJGWgoXx-_jtz_GgMybDWxKKq/exec',
    store: { name: 'TB. AIZA CIRUJI', sub: 'Jl. Raya Saketi-Bayah', phone: '08787 117 6447', bank: 'BRI 0166 0113 7004 507', footer: 'Terima kasih' },
    shs: ['penjualan', 'produk_jual', 'produk', 'pembelian', 'produk_beli', 'kas', 'kontak', 'cicil', 'ecer', 'users', 'roles', 'cms', 'absen', 'toko', 'skema'],
    cols: { penjualan: ['idpenjualan', 'user', 'date', 'bayar', 'catatan', 'diskon', 'idkontak', 'lokasi', 'foto', 'status'], produk_jual: ['idprodukjual', 'idpenjualan', 'idproduk', 'namaproduk', 'hargabeli', 'hargajual', 'qty', 'diskon', 'catatan'], produk: ['idproduk', 'subkategori', 'kategori', 'namaproduk', 'hargabeli', 'hargajual', 'stok', 'foto'], pembelian: ['idpembelian', 'user', 'date', 'bayar', 'catatan', 'idkontak', 'lokasi', 'foto', 'status'], produk_beli: ['idprodukbeli', 'idpembelian', 'idproduk', 'namaproduk', 'hargabeli', 'hargajual', 'qty'], kas: ['idkas', 'user', 'date', 'kategori', 'masuk', 'keluar', 'uraian', 'foto'], kontak: ['idkontak', 'user', 'kategori', 'nama', 'alamat', 'hp', 'lokasi', 'foto'], cicil: ['idcicil', 'idpenjualan', 'user', 'date', 'jumlah', 'catatan', 'idkontak'], ecer: ['idecer', 'date', 'user', 'idproduk', 'namaproduk', 'hargabeli', 'hargajual', 'qty', 'diskon', 'catatan'], users: ['user', 'password', 'role'], roles: ['role', 'hide', 'validasi'], cms: ['idcms', 'date', 'user', 'judul', 'kategori', 'foto', 'file', 'status', 'konten'], absen: ['idabsen', 'user', 'date', 'tipe', 'jam', 'lokasi', 'foto', 'catatan'], toko: ['id', 'name', 'sub', 'phone', 'bank', 'footer'], skema: ['sheet', 'cols', 'vis', 'form'] },
    vis: { penjualan: ['date', 'idkontak', 'status', 'user'], produk_jual: ['namaproduk', 'qty', 'hargajual'], produk: ['namaproduk', 'stok', 'hargajual'], pembelian: ['date', 'idkontak', 'status', 'user'], produk_beli: ['namaproduk', 'qty', 'hargabeli'], kas: ['date', 'kategori', 'uraian', 'masuk', 'keluar'], kontak: ['nama', 'hp', 'kategori'], cicil: ['date', 'idpenjualan', 'jumlah'], ecer: ['date', 'namaproduk', 'qty'], users: ['user', 'role'], roles: ['role', 'hide'], cms: ['judul', 'kategori', 'status'], absen: ['date', 'user', 'tipe', 'jam'], toko: ['id', 'name', 'phone'], skema: ['sheet', 'cols', 'vis'] }
  };

  const W = window, L = localStorage, $ = id => document.getElementById(id), dom = Object.fromEntries(['h', 'q', 'msg', 'tools', 'scanBox:scan-box', 'scanVid:scan-vid', 'fCam:f-cam', 'fImg:f-img', 'fDoc:f-doc', 'fImp:f-imp', 'sh:sh-sel', 'st:st-sel', 'act:act-sel', 'fb:box-form', 'db:box-dash', 'ls:list', 'ft', 'tape', 'bn:box-nota'].map(s => { const [k, v] = s.split(':'); return [k, $(v || k)]; }));
  let db = null, syncing = false, syncTimer = null, scanStream = null, scanTimer = null, seq = 0, needSync = 0;

  const K = { u: L.u || '', cur: 'penjualan', v: 'dash', idx: null, page: 1, sort: 0, dir: 1, grid: false, conf: null, prefill: null, parent: null, receiptRaw: '', prodIdx: null, slice: '', df: { u: '', from: '', to: '', kat: '' }, shs: [...HARD.shs], cols: JSON.parse(JSON.stringify(HARD.cols)), vis: JSON.parse(JSON.stringify(HARD.vis)), fvis: {}, db: Object.fromEntries(HARD.shs.map(s => [s, s === 'skema' ? HARD.shs.map(x => [x, HARD.cols[x].join(','), HARD.vis[x].join(','), HARD.cols[x].join(',')]) : []])), ret: null, prev: null, writing: false };

  const S2 = s => String(s || '').trim().toLowerCase(), N = v => { const n = parseFloat(String(v ?? '').replace(/[^\d.-]/g, '')); return (!isFinite(n) || n < 0) ? 0 : n; }, Z = v => parseFloat(String(v ?? '').replace(/[^\d.-]/g, '')) || 0;
  const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  const isSafeUrl = u => /^(https?:\/\/|data:(image|application|text)\/[a-zA-Z0-9.\-_+]+;base64,)/i.test(String(u || '').trim());
  const cols = (s = K.cur) => K.cols[s] || [], cI = (s, k) => cols(s).indexOf(k), cV = (r, s, k) => { const i = cI(s, k); return (r && i > -1 && r[i] !== undefined) ? String(r[i]) : ''; };
  const vis = (s = K.cur) => (K.vis[s] || cols(s)).filter(c => cols(s).includes(c)), fvis = (s = K.cur) => ((K.fvis?.[s]?.length) ? K.fvis[s] : cols(s)).filter(c => cols(s).includes(c));
  const REL = { penjualan: ['produk_jual', 'idpenjualan'], pembelian: ['produk_beli', 'idpembelian'], produk_jual: ['penjualan', 'idpenjualan'], produk_beli: ['pembelian', 'idpembelian'], cicil: ['penjualan', 'idpenjualan'] };
  const isTrx = (s = K.cur) => s === 'penjualan' || s === 'pembelian', parentRel = (s = K.cur) => (!isTrx(s) && REL[s]) ? REL[s] : [null, null], childOf = s => isTrx(s) ? REL[s][0] : null, fkCol = s => REL[s]?.[1] || null;
  const trxIdOf = (t, r) => cV(r, t, `id${t}`) || r?.[0] || '', isOpenStatus = st => ['draft', 'revisi'].includes(S2(st));
  const STOCK_SHEETS = ['produk_jual', 'produk_beli', 'ecer'], NO_ADD = ['penjualan', 'pembelian', 'produk_jual', 'produk_beli', 'cicil', 'ecer'], EXEMPT = ['back', 'menu', 'q', 'dir', 'grid', 'closemsg', 'more', 'reset-db', 'add', 'df-today', 'df-clear', 'login', 'reg', 'bypass', 'v-dash', 'v-kas', 'v-shop', 'logout', 'scan', 'stop-scan', 'theme', 'refresh'];
  const GEO_RE = /alamat|lokasi/i, DATE_RE = /date|tanggal/i, FOTO_RE = /foto/i;
  const genId = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0') + Math.random().toString(36).slice(2, 5).padEnd(3, '0'); };
  const fmtNum = n => N(n).toLocaleString('id-ID'), today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10), msg = t => { dom.msg.hidden = !t; dom.msg.textContent = t || ''; };
  const getTheme = () => L.theme || (W.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const applyTheme = t => { document.documentElement.dataset.theme = t; document.querySelector('meta[name="theme-color"]')?.setAttribute('content', t === 'dark' ? '#000' : '#fff'); };
  const qForm = sel => { const all = [...dom.fb.querySelectorAll('[data-col]')]; return sel instanceof RegExp ? all.find(i => sel.test(i.dataset.col)) : (sel ? all.find(i => i.dataset.col === sel) : all); };
  const openTab = u => W.open(u, '_blank', 'noopener,noreferrer');
  const dlUrl = (u, name, rev = false) => { const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { a.remove(); if (rev) URL.revokeObjectURL(u); }, 400); };
  const dl = (txt, name, mime = 'text/plain;charset=utf-8') => dlUrl(URL.createObjectURL(new Blob([txt], { type: mime })), name, true);

  const bc = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('apex_sync') : { postMessage() {}, onmessage: null };
  const safeRender = () => { const ae = document.activeElement; if (K.u && K.idx === null && K.v !== 'edit' && (!ae || (ae.id !== 'q' && !dom.fb.contains(ae) && !dom.db.contains(ae)))) render(); };
  bc.onmessage = e => { if (e.data === 'synced') idbRead('kv', 'apex_matrix').then(m => { if (m && typeof m === 'object') Object.assign(K.db, m); applySchemaTable(); safeRender(); }); else if (e.data === 'kick' && !syncing) syn(false); };

  function initDB(cb) {
    try {
      const rq = indexedDB.open('apex_db', 1);
      rq.onupgradeneeded = e => { const d = e.target.result; if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); if (!d.objectStoreNames.contains('mut')) d.createObjectStore('mut', { keyPath: 'i' }); };
      rq.onsuccess = e => { db = e.target.result; cb?.(); }; rq.onerror = () => cb?.();
    } catch { cb?.(); }
  }
  const idbRead = (st, k) => new Promise(res => { if (!db) return res(k !== undefined ? null : []); try { const s = db.transaction(st, 'readonly').objectStore(st), r = k !== undefined ? s.get(k) : s.getAll(); r.onsuccess = () => res(r.result ?? (k !== undefined ? null : [])); r.onerror = () => res(k !== undefined ? null : []); } catch { res(k !== undefined ? null : []); } });
  const idbWrite = (st, fn) => { if (!db) return; try { fn(db.transaction(st, 'readwrite').objectStore(st)); } catch {} };

  function save(row, tn = K.cur, y = 2) {
    idbWrite('mut', s => s.put({ i: Date.now().toString(36) + (seq = (seq + 1) % 1296).toString(36).padStart(2, '0'), tn, y, r: Array.isArray(row) ? row.slice() : Object.values(row) }));
    bc.postMessage('kick'); clearTimeout(syncTimer); syncTimer = setTimeout(() => syn(false), 120);
  }

  async function req(p = {}) {
    p.u = L.u || K.u || 'admin';
    for (const [url, ct, rf] of [[HARD.d1Url, 'application/json', undefined], [p.a !== 'sync_gas' ? HARD.gasUrl : '', 'text/plain;charset=utf-8', 'follow']]) {
      if (!url) continue;
      try { const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': ct }, body: JSON.stringify(p), redirect: rf, signal: AbortSignal.timeout?.(25000) }); const j = await r.json(); if (j?.ok) return j; } catch {}
    }
    return { ok: false };
  }

  const dedupeRows = rows => { const m = new Map(); rows.forEach(r => { const k = S2(r?.[0]); if (k) m.set(k, r); }); return [...m.values()]; };
  const remapRows = (rows, src, dst) => {
    if (!rows.length || !Array.isArray(src) || !Array.isArray(dst)) return rows;
    const s = src.map(S2), d = dst.map(S2);
    if (s.length === d.length && s.every((c, i) => c === d[i])) return rows;
    const idx = d.map(c => s.indexOf(c));
    return rows.map(r => idx.map((si, di) => si !== -1 ? (r[si] ?? '') : (r[di] ?? '')));
  };

  async function syn(force = false) {
    if (!navigator.onLine || !db) return false;
    if (syncing) { needSync = Math.max(needSync, force ? 2 : 1); return false; }
    syncing = true; msg('sync...');
    let ok = false;
    try {
      if (force) L.vs = '[]';
      const ver = JSON.parse(L.vs || '[]'), queued = await idbRead('mut');
      if (queued.length) {
        const opMap = new Map();
        queued.forEach(q => { const k = S2(q.r?.[0]); if (k || q.y === -1) opMap.set(`${S2(q.tn)}\0${k}`, q); });
        const pr = await req({ a: 'push', m: [...opMap.values()], tn: K.shs, cols: K.cols, gasUrl: HARD.gasUrl });
        if (!pr.ok) throw 0;
        idbWrite('mut', s => queued.forEach(x => s.delete(x.i)));
      }
      let m = force ? await req({ a: 'sync_gas', tn: K.shs, cols: K.cols, gasUrl: HARD.gasUrl }) : null;
      if (!m?.v) m = await req({ a: 'manifest', tn: K.shs, cols: K.cols });
      if (!m?.v) throw 0;
      (m.shs || []).forEach(s => { if (!K.shs.includes(s)) K.shs.push(s); });
      Object.entries(m.cols || {}).forEach(([k, c]) => { if (!K.cols[k] && c?.length) K.cols[k] = c; });
      Object.entries(m.vis || {}).forEach(([k, v]) => { if (!K.vis[k] && v?.length) K.vis[k] = v; });

      const seed = force ? [] : K.shs.flatMap((t, i) => (!m.v[i] || m.v[i] === '0_0_0') && K.db[t]?.length ? K.db[t].map(r => ({ tn: t, y: 2, r })) : []);
      if (seed.length) { const sr = await req({ a: 'push', m: seed, tn: K.shs, cols: K.cols, gasUrl: HARD.gasUrl }); if (sr.manifest?.v) m = sr.manifest; }

      const toPull = K.shs.map((_, i) => (force || (m.v[i] && m.v[i] !== ver[i])) ? { t: i } : null).filter(Boolean);
      if (toPull.length && !(await idbRead('mut')).length) {
        const b = await req({ a: 'pull_batch', reqs: toPull, tn: K.shs, cols: K.cols });
        if (b.ok && Array.isArray(b.results)) {
          b.results.forEach(x => {
            const name = K.shs[x?.t]; if (!name || !x?.v) return;
            ver[x.t] = x.v;
            if (!K.cols[name] && x.cols?.length) K.cols[name] = x.cols;
            K.db[name] = dedupeRows(remapRows(x.r || [], x.cols, K.cols[name]));
          });
          if (force && Array.isArray(m.shs)) K.shs.forEach(s => { if (!m.shs.includes(s) && !HARD.shs.includes(s)) K.db[s] = []; });
          applySchemaTable(); L.vs = JSON.stringify(ver); persist(); bc.postMessage('synced'); safeRender();
        }
      }
      ok = true;
    } catch { ok = false; }
    finally { syncing = false; const nxt = needSync; needSync = 0; if (nxt) setTimeout(() => syn(nxt === 2), 0); }
    msg(ok ? '' : 'offline');
    return ok;
  }

  function applySchemaTable() {
    const seen = new Set(K.db.skema.map(r => S2(r[0])));
    HARD.shs.forEach(s => { if (!seen.has(s)) K.db.skema.push([s, K.cols[s].join(','), K.vis[s].join(','), K.cols[s].join(',')]); });
    K.db.skema = dedupeRows(K.db.skema);
    const nextShs = [];
    K.db.skema.forEach(r => {
      const sh = S2(r[0]); if (!sh || nextShs.includes(sh)) return;
      nextShs.push(sh);
      const oldCols = (K.cols[sh] || ['id', 'nama', 'ket']).slice(), split = v => String(v || '').split(',').map(S2).filter(Boolean);
      const nc = split(r[1]), nv = split(r[2]), nf = split(r[3]);
      K.cols[sh] = nc.length ? nc : oldCols;
      K.vis[sh] = nv.filter(x => K.cols[sh].includes(x)); if (!K.vis[sh].length) K.vis[sh] = K.cols[sh].slice(0, 3);
      K.fvis[sh] = nf.filter(x => K.cols[sh].includes(x)); if (!K.fvis[sh].length) K.fvis[sh] = K.cols[sh].slice();
      K.db[sh] = dedupeRows(remapRows(K.db[sh] || [], oldCols, K.cols[sh]).map(dr => Object.assign(new Array(K.cols[sh].length).fill(''), dr.slice(0, K.cols[sh].length))));
    });
    HARD.shs.forEach(s => { if (!nextShs.includes(s)) nextShs.push(s); });
    K.shs = nextShs;
    if (!K.shs.includes(K.cur)) K.cur = K.shs[0];
  }

  const getStore = () => { const r = K.db.toko?.[0] || []; return Object.fromEntries(['name', 'sub', 'phone', 'bank', 'footer'].map(k => [k, cV(r, 'toko', k) || HARD.store[k] || ''])); };
  const setView = (v, idx = null) => { if (dom.q?.value.trim()) { dom.q.value = ''; K.page = 1; } if (K.v !== v && idx === null) K.prev = { v: K.v, cur: K.cur, slice: K.slice }; K.v = v; K.idx = idx; K.conf = null; };
  const userRow = (u, role, pw) => cols('users').map(c => ({ user: u, role, password: pw }[c] ?? ''));
  const getRole = () => K.u ? S2(cV(K.db.users?.find(r => S2(r[0]) === S2(K.u)), 'users', 'role') || 'user') : 'user';
  const isAdmin = () => getRole() === 'admin';
  const isUserVisible = (r, sh = K.cur) => {
    if (isAdmin() || sh === 'produk') return true;
    if (cI(sh, 'user') !== -1) return S2(cV(r, sh, 'user')) === S2(K.u);
    const [pSh, fk] = parentRel(sh), pRow = pSh && K.db[pSh]?.find(p => S2(trxIdOf(pSh, p)) === S2(cV(r, sh, fk)));
    return pRow ? isUserVisible(pRow, pSh) : true;
  };
  const getRoleRules = () => K.u ? (K.db.roles?.find(r => S2(r[0]) === getRole())?.[2] || '').toLowerCase().split(',').map(S2).filter(Boolean) : [];

        }
        if (K.idx === -1) { syncMasterProduk(K.cur, null, row); K.db[K.cur].push(row); save(row, K.cur, 2); }
        else if (K.idx >= 0) { syncMasterProduk(K.cur, oldRow, row); if (oldRow && S2(oldRow[0]) !== S2(row[0])) save(oldRow, K.cur, 0); K.db[K.cur][K.idx] = row; save(row, K.cur, 1); }
        K.db[K.cur] = dedupeRows(K.db[K.cur]);
        if (K.cur === 'skema') { if (oldRow?.[0] && oldRow[0] !== row[0]) dropDynamicSheet(S2(oldRow[0])); applySchemaTable(); syn(true); }

        if (isTrx() && trxIdOf(K.cur, row)) { syncTrx(K.cur, true); if (!isOpenStatus(cV(row, K.cur, 'status'))) K.parent = null; }
        if (K.cur === 'cicil' && cV(row, 'cicil', 'idpenjualan')) syncTrx('penjualan', true);

        else if (K.cur === 'penjualan' && trxIdOf(K.cur, row)) { K.receiptRaw = formatNota(trxIdOf(K.cur, row)); setView('nota', null); }
        else if (pType) { K.cur = 'produk'; K.grid = true; setView('list', null); }
        else setView('list', null);

      } finally { K.writing = false; }
    },

    'del-row': () => {
      if (K.conf !== 'del') { K.conf = 'del'; return render(); }
      const target = K.idx >= 0 ? K.db[K.cur][K.idx] : null;

      const id = isTrx() ? trxIdOf(K.cur, target) : (K.cur === 'kontak' ? (cV(target, 'kontak', 'idkontak') || target[0]) : target[0]), [pType, fk] = parentRel(K.cur), pid = pType ? (cV(target, K.cur, fk) || K.parent?.id) : null, delCicilJual = K.cur === 'cicil' ? cV(target, 'cicil', 'idpenjualan') : null;
      K.idx = null; dropRows(K.cur, r => r === target);
      if (K.cur === 'skema') { dropDynamicSheet(S2(id)); applySchemaTable(); syn(true); }
      if (isTrx() && id) dropTrxDeps(K.cur, id);
      if (K.cur === 'kontak' && id) ['penjualan', 'pembelian', 'cicil'].forEach(sh => { const ki = cI(sh, 'idkontak'); if (ki !== -1) (K.db[sh] || []).forEach(r => { if (S2(r[ki]) === S2(id)) { r[ki] = ''; save(r, sh, 1); } }); });
      if (pType && pid) syncTrx(pType, false);

    },
    'dup-row': () => { if (K.idx >= 0) { const old = (K.db[K.cur][K.idx] || []).slice(); K.prefill = Object.fromEntries(cols().map((col, i) => [col, i === 0 ? genId() : (old[i] || '')])); setView('form', -1); render(); } },
    'trx-pick-kontak': () => { if (!K.shs.includes('kontak')) return; const [pType] = parentRel(K.cur), op = K.idx === null && pType ? getOpenTrx(pType) : null, tCur = op ? pType : K.cur, tIdx = op ? K.db[pType].indexOf(op.row) : K.idx; K.ret = { cur: tCur, idx: tIdx, parent: K.parent, form: Object.fromEntries(qForm().map(i => [i.dataset.col, i.value])), col: 'idkontak' }; K.cur = 'kontak'; setView('list', null); dom.q.value = ''; K.page = 1; render(); },
    'pay-pas': () => { const [pType] = parentRel(K.cur), op = K.idx === null && pType ? getOpenTrx(pType) : null, tCur = op ? pType : K.cur, r = op ? op.row : (K.idx >= 0 ? K.db[K.cur][K.idx] : null), bayar = qForm('bayar'); if (bayar && r) bayar.value = String(Math.max(0, trxNet(tCur, r) + N(cV(r, tCur, 'diskon')) - N(qForm('diskon')?.value || cV(r, tCur, 'diskon')))); },
    cicil: () => { const [pType] = parentRel(K.cur), op = K.idx === null && pType ? getOpenTrx(pType) : null, r = op ? op.row : (K.idx >= 0 ? K.db[K.cur][K.idx] : null); if (!r) return; const pid = trxIdOf('penjualan', r); if (!pid) return; if (!K.shs.includes('cicil')) K.shs.push('cicil'); const rem = Math.max(0, trxNet('penjualan', r) - paidOf('penjualan', r)); K.cur = 'cicil'; K.prefill = { idpenjualan: pid, idkontak: cV(r, 'penjualan', 'idkontak'), date: today(), user: K.u || 'admin', jumlah: rem > 0 ? String(rem) : '' }; setView('form', -1); render(); },
    'show-nota': () => { const pid = (K.cur === 'penjualan' && K.idx >= 0) ? trxIdOf('penjualan', K.db.penjualan[K.idx]) : (K.parent?.type === 'penjualan' ? K.parent.id : trxIdOf('penjualan', K.db.penjualan?.[0])); if (pid) { K.receiptRaw = formatNota(pid); setView('nota', null); render(); } },
    rawbt: () => { if (!K.receiptRaw) return; const u = encodeURIComponent(K.receiptRaw.trim() + '\r\n\r\n\r\n'); location.href = /Android/i.test(navigator.userAgent) ? `intent:${u}#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;` : `rawbt:${u}`; },
    jpg: () => {
      if (!K.receiptRaw) return;
      const lines = K.receiptRaw.split(/\r?\n/), lh = 18, font = '13px monospace', can = document.createElement('canvas'), ctx = can.getContext('2d');
      ctx.font = font; can.width = Math.ceil(Math.max(0, ...lines.map(l => ctx.measureText(l).width))) || 280; can.height = lines.length * lh + 4;
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, can.width, can.height); ctx.fillStyle = '#000'; ctx.font = font; ctx.textBaseline = 'top';

    },
    print: () => W.print(),
    'reset-db': async () => { if (K.conf !== 'reset-db') { K.conf = 'reset-db'; return msg('reset? klik lagi'); } K.conf = null; ['kv', 'mut'].forEach(st => idbWrite(st, s => s.clear())); K.shs.forEach(s => { K.db[s] = []; }); applySchemaTable(); L.vs = '[]'; persist(); render(); await syn(true); render(); },
    'save-bulk': () => { const n = cols().length; dom.ls.querySelectorAll('[data-idx]').forEach(div => { const idx = parseInt(div.dataset.idx, 10); if (!isNaN(idx) && K.db[K.cur][idx]) { K.db[K.cur][idx] = Object.assign(new Array(n).fill(''), div.textContent.split('|').map(s => s.trim()).slice(0, n)); save(K.db[K.cur][idx], K.cur, 1); } }); K.db[K.cur] = dedupeRows(K.db[K.cur]); if (K.cur === 'skema') applySchemaTable(); persist(); syn(true); setView('list', null); render(); },
    grid: () => { K.grid = !K.grid; render(); }, dir: () => { K.dir = -K.dir; K.page = 1; render(); }, more: () => { K.page++; render(); },

      if (!['del-row', 'cart-del-trx', 'act-sel', 'reset-db'].includes(a) && K.conf) { K.conf = null; msg(); }

      if (isTrx() && K.db[K.cur]?.[idx]) { const tType = K.cur; K.parent = { type: tType, id: trxIdOf(tType, K.db[tType][idx]), open: true }; K.cur = childOf(tType); K.grid = false; setView('list', null); return render(); }

    if (t.dataset.df) { const k = t.dataset.df, pos = t.selectionStart; K.df[k] = t.value; persist(); render(); const next = dom.db.querySelector(`[data-df="${CSS.escape(k)}"]`); if (next) { next.focus(); if (typeof pos === 'number') try { next.setSelectionRange(pos, pos); } catch {} } return; }
    if (t.dataset.col) {

      for (let i = start; i < lines.length; i++) { const row = Object.assign(new Array(c.length).fill(''), lines[i].split(sep).map(s => s.trim()).slice(0, c.length)); if (!row[0]) row[0] = genId(); K.db[K.cur].push(row); save(row, K.cur, 2); }
      K.db[K.cur] = dedupeRows(K.db[K.cur]); if (K.cur === 'skema') applySchemaTable(); persist(); syn(true); render();

  });

  W.addEventListener('online', () => syn(true));

  if (navigator.serviceWorker && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('./sw.js').catch(() => {});

    if (L.theme) applyTheme(L.theme);
    try { const d = JSON.parse(L.getItem('apex') || 'null'); if (d && typeof d === 'object') { ['shs', 'cols', 'vis', 'fvis'].forEach(k => { if (d[k]) K[k] = d[k]; }); if (d.parent) K.parent = d.parent; if (d.cur && K.shs.includes(d.cur)) K.cur = d.cur; if (d.u) K.u = L.u = d.u; if (d.df) Object.assign(K.df, d.df); K.grid = Boolean(d.grid); } } catch {}

  })();
