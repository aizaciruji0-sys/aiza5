      kontak: ['nama', 'hp', 'kategori'], cicil: ['date', 'idpenjualan', 'jumlah'], ecer: ['date', 'namaproduk', 'qty'],
      users: ['user', 'role'], roles: ['role', 'hide'], cms: ['judul', 'kategori', 'status'],
      absen: ['date', 'user', 'tipe', 'jam'], toko: ['id', 'name', 'phone'], skema: ['sheet', 'cols', 'vis']
    }
  };
  const W = window, L = localStorage, $ = id => document.getElementById(id), dom = { q: $('q'), msg: $('msg'), sh: $('sh-sel'), st: $('st-sel'), act: $('act-sel'), fb: $('box-form'), db: $('box-dash'), ls: $('list'), ft: $('ft') };
  const S2 = s => String(s || '').trim().toLowerCase(), Z = v => parseFloat(String(v ?? '').replace(/[^\d.-]/g, '')) || 0, N = v => Math.max(0, Z(v));

  const dl = (c, f, m = 'text/plain;charset=utf-8') => dlUrl(URL.createObjectURL(new Blob([c], { type: m })), f, true);

  const K = {
    u: L.u || '', cur: 'penjualan', v: 'dash', idx: null, page: 1, sort: 0, dir: 1, grid: false, conf: null, prefill: null, parent: null, receiptRaw: '', slice: '',
    df: { u: '', from: '', to: '', kat: '' }, shs: [...HARD.shs], cols: JSON.parse(JSON.stringify(HARD.cols)), vis: JSON.parse(JSON.stringify(HARD.vis)),
    fvis: {}, db: Object.fromEntries(HARD.shs.map(s => [s, s === 'skema' ? HARD.shs.map(x => [x, HARD.cols[x].join(','), HARD.vis[x].join(','), HARD.cols[x].join(',')]) : []])), ret: null, prev: null
  };

  let db = null, syncing = false, needSync = 0, syncTimer = null, scanStream = null, scanTimer = null, seq = 0;
  const bc = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('apex_sync') : { postMessage() {} };
  const safeRender = () => { const ae = document.activeElement; if (K.u && K.idx === null && K.v !== 'edit' && (!ae || (ae.id !== 'q' && !dom.fb.contains(ae) && !dom.db.contains(ae)))) render(); };
  bc.onmessage = e => {
    if (e.data === 'synced') idbOp('kv', 'readonly', s => s.get('apex_matrix'), null).then(m => { if (m && typeof m === 'object') Object.assign(K.db, m); applySchemaTable(); safeRender(); });
    else if (e.data === 'kick' && !syncing) syn(false);
  };

  const initDB = cb => { try { const rq = indexedDB.open('apex_db', 1); rq.onupgradeneeded = e => { const d = e.target.result; if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); if (!d.objectStoreNames.contains('mut')) d.createObjectStore('mut', { keyPath: 'i' }); }; rq.onsuccess = e => { db = e.target.result; cb?.(); }; rq.onerror = () => cb?.(); } catch { cb?.(); } };
  const idbOp = (st, mode, fn, fb) => new Promise(res => { if (!db) return res(fb); try { const r = fn(db.transaction(st, mode).objectStore(st)); if (r && 'onsuccess' in r) { r.onsuccess = () => res(r.result ?? fb); r.onerror = () => res(fb); } else res(true); } catch { res(fb); } });
  const save = (row, tn = K.cur, y = 2) => { idbOp('mut', 'readwrite', s => s.put({ i: Date.now().toString(36) + (seq = (seq + 1) % 1296).toString(36).padStart(2, '0'), tn, y, r: Array.isArray(row) ? row.slice() : Object.values(row) }), false); bc.postMessage('kick'); clearTimeout(syncTimer); syncTimer = setTimeout(() => syn(false), 120); };

  async function req(p = {}) {
    p.u = L.u || K.u || 'admin';
    for (const [url, ct, okIf] of [[HARD.d1Url, 'application/json', true], [p.a !== 'sync_gas' && HARD.gasUrl, 'text/plain;charset=utf-8', false]]) {
      if (!url) continue;
      try { const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': ct }, body: JSON.stringify(p), redirect: 'follow', signal: AbortSignal.timeout?.(25000) }); if (!okIf || res.ok) { const j = await res.json(); if (!okIf || j?.ok) return { ok: Boolean(j?.ok), ...j }; } } catch {}
    }
    return { ok: false };
  }

  const remapRows = (rows, src, dst) => (!rows.length || !Array.isArray(src) || !Array.isArray(dst)) ? rows : ((s, d) => (s.length === d.length && s.every((c, i) => c === d[i])) ? rows : rows.map(r => d.map((c, di) => { const si = s.indexOf(c); return si !== -1 ? (r[si] ?? '') : (r[di] ?? ''); })))(src.map(S2), dst.map(S2));
  const dedupeRows = rows => [...new Map((rows || []).filter(r => Array.isArray(r) && S2(r[0])).map(r => [S2(r[0]), r])).values()];
  const mergeQueue = q => [...q.reduce((m, x) => { const t = S2(x?.tn), pk = S2(x?.r?.[0]); if (t) m.set(Number(x.y) === -1 ? `${t}\0*` : `${t}\0${pk}`, x); return m; }, new Map()).values()];

  async function syn(force = false) {
    if (!navigator.onLine || !db) return false;
    if (syncing) { needSync = Math.max(needSync, force ? 2 : 1); return false; }
    syncing = true; msg('sync...');
    let ok = false;
    try {
      if (force) L.vs = '[]';
      const ver = JSON.parse(L.vs || '[]'), queued = await idbOp('mut', 'readonly', s => s.getAll(), []);
      if (queued.length) {
        const pr = await req({ a: 'push', m: mergeQueue(queued), tn: K.shs, cols: K.cols, gasUrl: HARD.gasUrl });
        if (!pr.ok) throw 0;
        await idbOp('mut', 'readwrite', s => queued.forEach(x => s.delete(x.i)), false);
      }
      let m = force ? await req({ a: 'sync_gas', tn: K.shs, cols: K.cols, gasUrl: HARD.gasUrl }) : null;
      if (!m?.v) m = await req({ a: 'manifest', tn: K.shs, cols: K.cols });
      if (!m?.v) throw 0;
      (m.shs || []).forEach(s => { if (!K.shs.includes(s)) K.shs.push(s); });
      Object.entries(m.cols || {}).forEach(([k, c]) => { if (!K.cols[k] && c?.length) K.cols[k] = c; });
      Object.entries(m.vis || {}).forEach(([k, v]) => { if (!K.vis[k] && v?.length) K.vis[k] = v; });
      if (!force) {
        const seed = K.shs.flatMap((t, i) => ((!m.v[i] || m.v[i] === '0_0_0') && K.db[t]?.length) ? K.db[t].map(r => ({ tn: t, y: 2, r })) : []);
        if (seed.length) { const sr = await req({ a: 'push', m: seed, tn: K.shs, cols: K.cols, gasUrl: HARD.gasUrl }); if (sr.manifest?.v) m = sr.manifest; }
      }
      const toPull = K.shs.map((_, i) => (force || (m.v[i] && m.v[i] !== ver[i])) ? { t: i } : null).filter(Boolean);
      if (toPull.length && !(await idbOp('mut', 'readonly', s => s.getAll(), [])).length) {
        const b = await req({ a: 'pull_batch', reqs: toPull, tn: K.shs, cols: K.cols });
        if (b.ok && Array.isArray(b.results)) {
          b.results.forEach(x => { const name = K.shs[x?.t]; if (!name || !x?.v) return; ver[x.t] = x.v; if (!K.cols[name] && x.cols?.length) K.cols[name] = x.cols; K.db[name] = dedupeRows(remapRows(x.r || [], x.cols, K.cols[name])); });
          if (force && Array.isArray(m.shs)) Object.keys(K.db).forEach(k => { if (!m.shs.includes(k) && !HARD.shs.includes(k)) delete K.db[k]; });
          applySchemaTable(); L.vs = JSON.stringify(ver); persist(); bc.postMessage('synced'); safeRender();
        }
      }
      ok = true;
    } catch { ok = false; }
    finally { syncing = false; const nxt = needSync; needSync = 0; if (nxt) setTimeout(() => syn(nxt === 2), 0); }
    msg(ok ? '' : 'offline');
    return ok;
  }

  function applySchemaTable() {
    const seen = new Set(K.db.skema.map(r => S2(r[0])));
    HARD.shs.forEach(s => { if (!seen.has(s)) K.db.skema.push([s, K.cols[s].join(','), K.vis[s].join(','), K.cols[s].join(',')]); });
    K.db.skema = dedupeRows(K.db.skema);
    const nextShs = [];
    K.db.skema.forEach(r => {
      const sh = S2(r[0]); if (!sh || nextShs.includes(sh)) return;
      nextShs.push(sh);
      const oldCols = (K.cols[sh] || ['id', 'nama', 'ket']).slice(), [nc, nv, nf] = [1, 2, 3].map(i => String(r[i] || '').split(',').map(S2).filter(Boolean));
      K.cols[sh] = nc.length ? nc : oldCols;
      K.vis[sh] = nv.filter(x => K.cols[sh].includes(x)); if (!K.vis[sh].length) K.vis[sh] = K.cols[sh].slice(0, 3);
      K.fvis[sh] = nf.filter(x => K.cols[sh].includes(x)); if (!K.fvis[sh].length) K.fvis[sh] = K.cols[sh].slice();
      K.db[sh] = dedupeRows(remapRows(K.db[sh] || [], oldCols, K.cols[sh])).map(dr => { const row = dr.slice(0, K.cols[sh].length); while (row.length < K.cols[sh].length) row.push(''); return row; });
    });
    HARD.shs.forEach(s => { if (!nextShs.includes(s)) nextShs.push(s); });
    K.shs = nextShs; if (!K.shs.includes(K.cur)) K.cur = K.shs[0];
  }

  const cols = (s = K.cur) => K.cols[s] || [], cI = (s, k) => cols(s).indexOf(k), cV = (r, s, k) => { const i = cI(s, k); return (r && i > -1 && r[i] !== undefined) ? String(r[i]) : ''; };
  const vis = (s = K.cur) => (K.vis[s] || cols(s)).filter(c => cols(s).includes(c)), fvis = (s = K.cur) => ((K.fvis?.[s]?.length) ? K.fvis[s] : cols(s)).filter(c => cols(s).includes(c));
  const REL = { penjualan: ['produk_jual', 'idpenjualan'], pembelian: ['produk_beli', 'idpembelian'], produk_jual: ['penjualan', 'idpenjualan'], produk_beli: ['pembelian', 'idpembelian'], cicil: ['penjualan', 'idpenjualan'] };
  const isTrx = (s = K.cur) => s === 'penjualan' || s === 'pembelian', trxIdOf = (t, r) => cV(r, t, `id${t}`) || r?.[0] || '', isOpenSt = st => ['draft', 'revisi'].includes(S2(st));
  const childOf = s => isTrx(s) ? REL[s][0] : null, parentRel = s => (!isTrx(s) && REL[s]) ? REL[s] : [null, null], fkCol = s => REL[s]?.[1] || null;
  const STOCK_SHEETS = ['produk_jual', 'produk_beli', 'ecer'], NO_ADD = ['penjualan', 'pembelian', 'produk_jual', 'produk_beli', 'cicil', 'ecer'], GEO_RE = /alamat|lokasi/i, FOTO_RE = /foto/i, DATE_RE = /date|tanggal/i;
  const EXEMPT = new Set(['back', 'menu', 'q', 'dir', 'grid', 'closemsg', 'more', 'reset-db', 'add', 'df-today', 'df-clear', 'login', 'reg', 'bypass', 'v-dash', 'v-kas', 'v-shop', 'logout', 'scan', 'stop-scan', 'theme', 'refresh']);

  const genId = (sh = K.cur) => { const d = new Date(), pfx = String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0'), used = new Set((K.db[sh] || []).map(r => S2(r?.[0]))); let id = ''; do { id = pfx + Math.random().toString(36).slice(2, 5).padEnd(3, '0'); } while (used.has(S2(id))); return id; };
  const setTheme = t => { const mode = t || L.theme || (W.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); if (t) L.theme = mode; document.documentElement.style.colorScheme = mode; document.querySelector('meta[name="theme-color"]')?.setAttribute('content', mode === 'dark' ? '#000' : '#fff'); return mode; };
  const qForm = sel => { const all = [...dom.fb.querySelectorAll('[data-col]')]; return sel instanceof RegExp ? all.find(i => sel.test(i.dataset.col)) : (sel ? all.find(i => i.dataset.col === sel) : all); };
  const dropDynSheet = sh => { const s = S2(sh); if (s && !HARD.shs.includes(s)) save([s], s, -1); };
  const findMasterProd = (r, sh) => { if (!r) return null; const id = S2(cV(r, sh, 'idproduk')), nm = S2(cV(r, sh, 'namaproduk')); return (K.db.produk || []).find(p => (id && S2(cV(p, 'produk', 'idproduk') || p[0]) === id) || (nm && S2(cV(p, 'produk', 'namaproduk')) === nm)) || null; };
  const kontakName = kId => { if (!kId) return ''; const r = (K.db.kontak || []).find(x => S2(cV(x, 'kontak', 'idkontak') || x[0]) === S2(kId)); return r ? (cV(r, 'kontak', 'nama') || kId) : kId; };

  const setView = (v, idx = null) => { if (dom.q.value.trim()) { dom.q.value = ''; K.page = 1; } if (K.v !== v && idx === null) K.prev = { v: K.v, cur: K.cur, slice: K.slice }; K.v = v; K.idx = idx; K.conf = null; };
  const getRole = () => K.u ? S2(cV(K.db.users?.find(r => S2(r[0]) === S2(K.u)), 'users', 'role') || 'user') : 'user';
  const isAdmin = () => getRole() === 'admin';
  const isUserVisible = (r, sh = K.cur) => {
    if (isAdmin() || sh === 'produk') return true;

    const [pSh, fk] = parentRel(sh), pRow = pSh && K.db[pSh]?.find(p => S2(trxIdOf(pSh, p)) === S2(cV(r, sh, fk)));

  };
  const getRoleRules = () => K.u ? (K.db.roles?.find(r => S2(r[0]) === getRole())?.[2] || '').toLowerCase().split(',').map(S2).filter(Boolean) : [];
  const hasAccess = (k, s = K.cur) => {
    const key = S2(k);

    if (!hidden) return true;
    const list = hidden.split(',').map(S2), sh = S2(s);

    'save-bulk': () => { const n = cols().length, divs = [...dom.ls.querySelectorAll('[data-idx]')], next = new Map(); for (const div of divs) { const idx = parseInt(div.dataset.idx, 10); if (isNaN(idx) || !K.db[K.cur][idx]) continue; const p = div.textContent.split('|').map(s => s.trim()); while (p.length < n) p.push(''); const row = p.slice(0, n), pk = S2(row[0]); if (!pk) return msg('id wajib diisi'); if (next.has(pk)) return msg('id duplikat: ' + row[0]); next.set(pk, { idx, row, old: K.db[K.cur][idx] }); } next.forEach(({ idx, row, old }) => { if (old && S2(old[0]) !== S2(row[0])) save(old, K.cur, 0); K.db[K.cur][idx] = row; save(row, K.cur, 1); }); K.db[K.cur] = dedupeRows(K.db[K.cur]); if (K.cur === 'skema') applySchemaTable(); persist(); syn(true); setView('list', null); render(); },
    grid: () => { K.grid = !K.grid; render(); }, dir: () => { K.dir = -K.dir; K.page = 1; render(); }, more: () => { K.page++; render(); }, logout: () => { K.u = L.u = ''; K.parent = K.ret = K.prev = null; K.slice = ''; persist(); render(); },
    gimg: () => { const q = qForm('namaproduk')?.value || qForm('nama')?.value || dom.q.value || ''; if (q) openTab('https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(q)); },
    navigasi: () => { const loc = (qForm(GEO_RE)?.value || '').trim(); if (loc) (/Android|iPhone|iPad/i.test(navigator.userAgent) ? (location.href = `geo:${loc}?q=${encodeURIComponent(loc)}`) : openTab(`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(loc)}`)); },
    gps: () => { const trg = qForm(GEO_RE); if (trg && navigator.geolocation) navigator.geolocation.getCurrentPosition(p => { trg.value = `${p.coords.latitude.toFixed(6)},${p.coords.longitude.toFixed(6)}`; }, () => msg('gps err'), { enableHighAccuracy: true, timeout: 5000 }); },
    'sh-sel': el => { K.cur = el.value; K.parent = K.prefill = K.ret = null; setView('list', null); K.page = 1; K.slice = ''; render(); },
    'st-sel': el => { K.sort = parseInt(el.value, 10) || 0; K.page = 1; render(); },
    'act-sel': el => { const a = el.value; el.value = ''; if (a === 'edit') { setView(K.v === 'edit' ? 'list' : 'edit', null); render(); } else if (a === 'tsv') dl([cols().join('\t'), ...(K.db[K.cur] || []).map(r => r.join('\t'))].join('\n'), `${K.cur}_${today()}.tsv`, 'text/tab-separated-values;charset=utf-8'); else if (a === 'imp') pickFile('imp', '.tsv,.txt,.csv'); else if (a === 'clear') { if (K.conf !== 'clear') { K.conf = 'clear'; return msg(`clear ${K.cur}?`); } (K.db[K.cur] || []).forEach(r => save(r, K.cur, 0)); K.db[K.cur] = []; K.conf = null; persist(); syn(true); render(); } }
  };

  const readFile = (file, mode, cb) => { const rd = new FileReader(); rd.onload = ev => cb(ev.target.result || ''); rd[mode](file); };
  const pickFile = (kind, accept, capture) => {
    const inp = document.createElement('input'); inp.type = 'file'; if (accept) inp.accept = accept; if (capture) inp.capture = capture;
    inp.onchange = () => {
      const file = inp.files?.[0]; if (!file) return;
      if (kind === 'imp') return readFile(file, 'readAsText', text => { const lines = text.split(/\r?\n/).filter(Boolean); if (!lines.length) return; const sep = lines[0].includes('\t') ? '\t' : (lines[0].includes(';') ? ';' : ','), c = cols(), start = lines[0].split(sep).map(S2).every(h => c.includes(h)) ? 1 : 0, rows = K.db[K.cur], idxMap = new Map(rows.map((r, idx) => [S2(r[0]), idx])); for (let i = start; i < lines.length; i++) { const parts = lines[i].split(sep).map(s => s.trim()), row = new Array(c.length).fill(''); for (let j = 0; j < Math.min(parts.length, c.length); j++) row[j] = parts[j]; if (!row[0]) row[0] = genId(); const pk = S2(row[0]); if (idxMap.has(pk)) { rows[idxMap.get(pk)] = row; save(row, K.cur, 1); } else { idxMap.set(pk, rows.length); rows.push(row); save(row, K.cur, 2); } } K.db[K.cur] = dedupeRows(rows); if (K.cur === 'skema') applySchemaTable(); persist(); syn(true); render(); });
      const trgCol = kind === 'doc' ? 'file' : 'foto', tInp = qForm(trgCol) || qForm(new RegExp(trgCol, 'i')), jInp = kind === 'doc' ? qForm(/judul|nama/i) : null;
      if (jInp && !jInp.value) jInp.value = file.name;
      const apply = d => { if (tInp) { tInp.value = d; updateFormThumb(tInp); } };
      if (kind === 'doc') readFile(file, 'readAsDataURL', apply);
      else readFile(file, 'readAsDataURL', d => { const im = new Image(); im.onload = () => { const sc = im.width > 480 ? 480 / im.width : 1, can = document.createElement('canvas'); can.width = Math.round(im.width * sc); can.height = Math.round(im.height * sc); can.getContext('2d').drawImage(im, 0, 0, can.width, can.height); apply(can.toDataURL('image/jpeg', 0.65)); }; im.onerror = () => apply(d); im.src = d; });
    };
    inp.click();
  };

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-a]');
    if (b) {
      if (b.tagName === 'SELECT') return;
      const a = b.dataset.a;
      if (a.startsWith('ref-kontak-trx-')) { K.cur = a.slice(15); K.slice = ''; setView('list', null); dom.q.value = (b.dataset.kid || '').trim(); K.page = 1; return render(); }
      if (a.startsWith('ref-')) { const cName = b.dataset.refCol || ''; K.ret = { cur: K.cur, idx: K.idx, parent: K.parent, form: Object.fromEntries(qForm().map(i => [i.dataset.col, i.value])), col: cName }; K.cur = a.slice(4); setView('list', null); dom.q.value = (cName ? (qForm(cName)?.value || '') : '').trim(); K.page = 1; return render(); }
      if (!['del-row', 'batal-trx', 'act-sel', 'reset-db'].includes(a) && K.conf) { K.conf = null; msg(); }
      if (a === 'closemsg') { K.conf = null; return msg(); }
      if (a === 'theme') { setTheme(setTheme() === 'dark' ? 'light' : 'dark'); return render(); }
      if (a === 'login' || a === 'reg') return actions.auth(a === 'reg');
      if (a === 'df-today' || a === 'df-clear') { K.df = a === 'df-today' ? { ...K.df, from: today(), to: today() } : { u: '', from: '', to: '', kat: '' }; persist(); return render(); }
      if (/^v-(dash|kas|shop|jual|beli)$/.test(a)) {
        K.prefill = K.ret = null; K.slice = '';
        if (a === 'v-dash') setView('dash', null);
        else if (a === 'v-kas') { if (!K.shs.includes('kas')) K.shs.push('kas'); K.cur = 'kas'; setView('form', -1); }
        else if (a === 'v-shop') { K.cur = 'produk'; K.grid = true; setView('list', null); }
        else { const t = a === 'v-jual' ? 'penjualan' : 'pembelian', op = getOpenTrx(t); if (op) K.parent = { type: t, id: op.id, open: true }; K.cur = REL[t][0]; K.grid = false; setView('list', null); }
        return render();
      }
      if (a === 'cam') return pickFile('img', 'image/*', 'environment');
      if (a === 'pic') return pickFile('img', 'image/*');
      if (a === 'doc-upload') return pickFile('doc');
      if (a === 'add-cart-item') { K.prefill = null; setView('form', -1); return render(); }
      return actions[a]?.(b);
    }
    const r = e.target.closest('#list>[data-idx]');
    if (r && K.v === 'list' && K.idx === null) {
      const idx = parseInt(r.dataset.idx, 10);
      if (K.ret) { K.ret.form[K.ret.col] = K.db[K.cur]?.[idx]?.[0] || ''; K.cur = K.ret.cur; K.parent = K.ret.parent; setView('form', K.ret.idx); return render(); }
      if (K.cur === 'cms') { setView('cms_detail', idx); return render(); }
      if (K.cur === 'produk') { const isB = K.parent?.type === 'pembelian', pType = isB ? 'pembelian' : 'penjualan'; K.parent = ensureOpenTrx(pType); return prodTo(isB ? 'produk_beli' : 'produk_jual', K.db.produk[idx]); }
      if (isTrx() && K.db[K.cur]?.[idx]) K.parent = { type: K.cur, id: trxIdOf(K.cur, K.db[K.cur][idx]) };
      setView('form', idx); render();
    }
  });

  document.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'q') { if (K.v === 'menu') { const qm = S2(t.value); dom.ft.querySelectorAll('button[data-a]').forEach(btn => { btn.hidden = qm && !btn.textContent.toLowerCase().includes(qm); }); } else { K.page = 1; render(); } return; }
    if (t.dataset.df) { const k = t.dataset.df, pos = t.selectionStart; K.df[k] = t.value; persist(); render(); const next = dom.db.querySelector(`[data-df="${CSS.escape(k)}"]`); if (next) { next.focus(); if (typeof pos === 'number') try { next.setSelectionRange(pos, pos); } catch {} } return; }
    if (t.dataset.col) {
      updateFormThumb(t);
      if (['idproduk', 'namaproduk'].includes(t.dataset.col) && K.cur !== 'produk') { const q = S2(t.value), f = q && K.db.produk?.find(p => S2(cV(p, 'produk', 'idproduk') || p[0]) === q || S2(cV(p, 'produk', 'namaproduk')) === q); if (f) qForm().forEach(inp => { if (['idproduk', 'namaproduk', 'hargabeli', 'hargajual'].includes(inp.dataset.col)) { const fi = cI('produk', inp.dataset.col); if (fi !== -1) inp.value = f[fi] || ''; } }); }
      dom.ft.querySelectorAll('button[data-ref-col]').forEach(btn => { btn.hidden = !hasRefMatch(btn.dataset.a.slice(4), qForm(btn.dataset.refCol)?.value); });
    }
  });

  document.addEventListener('change', e => { if (e.target.dataset.a && actions[e.target.dataset.a]) actions[e.target.dataset.a](e.target); });
  document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && dom.fb.contains(e.target)) { e.preventDefault(); !K.u ? actions.auth(false) : actions['save-row'](); } else if (e.key === 'Escape') (!$('scan-box').hidden ? stopScan() : actions.back()); });
  W.addEventListener('online', () => syn(true));
  navigator.storage?.persist?.().catch(() => {});
  if (navigator.serviceWorker && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('./sw.js').catch(() => {});

  try { const d = JSON.parse(L.getItem('apex') || 'null'); if (d && typeof d === 'object') { ['shs', 'cols', 'vis', 'fvis'].forEach(k => { if (d[k]) K[k] = d[k]; }); if (d.parent) K.parent = d.parent; if (d.cur && K.shs.includes(d.cur)) K.cur = d.cur; if (d.u) K.u = L.u = d.u; if (d.df) Object.assign(K.df, d.df); K.grid = Boolean(d.grid); } } catch {}
  initDB(async () => { const matrix = await idbOp('kv', 'readonly', s => s.get('apex_matrix'), null); if (matrix && typeof matrix === 'object') Object.assign(K.db, matrix); applySchemaTable(); render(); syn(true); });
  </script>
