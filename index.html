<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#000">
  <title>APEX</title>
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22APEX%22%2C%22short_name%22%3A%22APEX%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23000000%22%2C%22theme_color%22%3A%22%23000000%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%2520viewBox%3D'0%25200%2520512%2520512'%253E%253Crect%2520width%3D'512'%2520height%3D'512'%2520fill%3D'%2523000'%2F%253E%253Cpath%2520d%3D'M256%2520108L140%2520404h38l28-74h100l28%252074h38L256%2520108zm-38%2520190l38-102%252038%2520102h-76z'%2520fill%3D'%2523fff'%2F%253E%253C%2Fsvg%3E%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%7D">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%23000'/%3E%3Cpath d='M256 108L140 404h38l28-74h100l28 74h38L256 108zm-38 190l38-102 38 102h-76z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%23000'/%3E%3Cpath d='M256 108L140 404h38l28-74h100l28 74h38L256 108zm-38 190l38-102 38 102h-76z' fill='%23fff'/%3E%3C/svg%3E">
  <style>
    :root{color-scheme:light dark;--gap:4px}
    :root[data-theme=light]{color-scheme:light}
    :root[data-theme=dark]{color-scheme:dark}
    *{box-sizing:border-box;margin:0;padding:0;border-radius:0!important;transition:none!important;animation:none!important;box-shadow:none!important}
    [hidden]{display:none!important}
    body{
      display:flex;flex-direction:column;gap:var(--gap);
      padding:var(--gap) var(--gap) 60px;
      font:14px/1.3 sans-serif;overflow-wrap:anywhere;overflow-x:hidden;
    }
    img,video{max-width:100%;height:auto;border:none}
    header,footer,main,#tools,#box-form,#box-nota{display:flex;flex-wrap:wrap;gap:var(--gap);width:100%}
    header,footer{background:Canvas;color:CanvasText;z-index:10}
    header{position:sticky;top:0;flex-wrap:nowrap;padding-top:env(safe-area-inset-top,0px)}
    footer{position:fixed;inset:auto 0 0;padding:var(--gap);padding-bottom:calc(var(--gap) + env(safe-area-inset-bottom,0px))}
    button,input,select,textarea{
      flex:1 1 130px;min-width:0;min-height:48px;padding:8px 10px;
      border:1px solid;background:none;color:inherit;font:inherit;
    }
    textarea{display:block;resize:vertical;min-height:80px}
    textarea[data-col="hide"],textarea[data-col="konten"]{flex:1 1 100%;width:100%;min-height:calc(100dvh - 180px)}
    header>input{flex:1;min-width:60px}
    header>button{flex:none;min-width:48px;padding:8px 12px}
    #msg{padding:6px 4px;font-weight:bold}
    #box-dash,#list{display:grid;gap:var(--gap);width:100%}
    #box-dash{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}
    #box-dash>button{padding:10px 8px;text-align:left;min-height:52px}
    #list{grid-template-columns:minmax(0,1fr)}
    #list>div{padding:12px 4px;min-height:48px;display:flex;align-items:center}
    body[data-grid="1"] #list{grid-template-columns:repeat(auto-fill,minmax(min(100%,max(130px,calc(20% - 4px))),1fr))}
    body[data-grid="1"] #list>div{flex-direction:column;align-items:flex-start;padding:4px}
    body[data-grid="1"] #list img{display:block;width:100%;height:85px;object-fit:cover;margin-bottom:4px}
    #tape{width:100%;max-width:280px;white-space:pre-wrap;font:12px/1.25 monospace}
    @media print{
      body{padding:0}
      header,footer,#tools,#msg{display:none!important}
      #tape{width:58mm!important;max-width:none}
    }
  </style>
  <script>try{var t=localStorage.theme;if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
  <header id="h">
    <button data-a="menu">≡</button>
    <input type="search" id="q" placeholder="Cari..." autocomplete="off">
    <button data-a="refresh" title="Sync / Refresh">↻</button>
    <button data-a="scan" title="Scan Barcode / QR">📷</button>
    <button data-a="add">add</button>
  </header>
  <p id="msg" data-a="closemsg" hidden></p>
  <div id="scan-box" hidden>
    <video id="scan-vid" autoplay playsinline muted></video>
    <button data-a="stop-scan">✕ Tutup Scanner</button>
  </div>
  <main>
    <div id="tools">
      <select id="sh-sel" data-a="sh-sel"></select>
      <select id="st-sel" data-a="st-sel"></select>
      <button data-a="dir">^</button>
      <button data-a="grid">#</button>
      <select id="act-sel" data-a="act-sel">
        <option value="" disabled selected>act</option>
        <option value="edit">edit</option>
        <option value="tsv">tsv export</option>
        <option value="imp">import</option>
        <option value="clear">clear</option>
      </select>
    </div>
    <div id="box-form"></div>
    <div id="box-dash"></div>
    <div id="box-nota"><pre id="tape"></pre></div>
    <div id="list"></div>
  </main>
  <footer id="ft"></footer>
  <input id="f-cam" type="file" accept="image/*" capture="environment" hidden>
  <input id="f-img" type="file" accept="image/*" hidden>
  <input id="f-doc" type="file" hidden>
  <input id="f-imp" type="file" accept=".tsv,.txt,.csv" hidden>

  <script>
  'use strict';

  /* ============================================================
     1. KONFIGURASI DINAMIS SSOT
     ============================================================ */
  const HARD = {
    d1Url: 'https://aiza5.aizaciruji0.workers.dev',
    gasUrl: 'https://script.google.com/macros/s/AKfycbzaLGQzwe3hoGekhRpMXgg3KOFA2YCdW5jvu5AY4LEoJGWgoXx-_jtz_GgMybDWxKKq/exec',
    store: { name: 'TB. AIZA CIRUJI', sub: 'Jl. Raya Saketi-Bayah', phone: '08787 117 6447', bank: 'BRI 0166 0113 7004 507', footer: 'Terima kasih' },
    shs: ['penjualan', 'produk_jual', 'produk', 'pembelian', 'produk_beli', 'kas', 'kontak', 'cicil', 'ecer', 'users', 'roles', 'cms', 'absen', 'toko', 'skema'],
    cols: {
      penjualan: ['idpenjualan', 'user', 'date', 'bayar', 'catatan', 'diskon', 'idkontak', 'lokasi', 'foto', 'status'],
      produk_jual: ['idprodukjual', 'idpenjualan', 'idproduk', 'namaproduk', 'hargabeli', 'hargajual', 'qty', 'diskon', 'catatan'],
      produk: ['idproduk', 'subkategori', 'kategori', 'namaproduk', 'hargabeli', 'hargajual', 'stok', 'foto'],
      pembelian: ['idpembelian', 'user', 'date', 'bayar', 'catatan', 'idkontak', 'lokasi', 'foto', 'status'],
      produk_beli: ['idprodukbeli', 'idpembelian', 'idproduk', 'namaproduk', 'hargabeli', 'hargajual', 'qty'],
      kas: ['idkas', 'user', 'date', 'kategori', 'masuk', 'keluar', 'uraian', 'foto'],
      kontak: ['idkontak', 'user', 'kategori', 'nama', 'alamat', 'hp', 'lokasi', 'foto'],
      cicil: ['idcicil', 'idpenjualan', 'user', 'date', 'jumlah', 'catatan', 'idkontak'],
      ecer: ['idecer', 'date', 'user', 'idproduk', 'namaproduk', 'hargabeli', 'hargajual', 'qty', 'diskon', 'catatan'],
      users: ['user', 'password', 'role'],
      roles: ['role', 'hide', 'validasi'],
      cms: ['idcms', 'date', 'user', 'judul', 'kategori', 'foto', 'file', 'status', 'konten'],
      absen: ['idabsen', 'user', 'date', 'tipe', 'jam', 'lokasi', 'foto', 'catatan'],
      toko: ['id', 'name', 'sub', 'phone', 'bank', 'footer'],
      skema: ['sheet', 'cols', 'vis', 'form']
    },
    vis: {
      penjualan: ['date', 'idkontak', 'status', 'user'],
      produk_jual: ['namaproduk', 'qty', 'hargajual'],
      produk: ['namaproduk', 'stok', 'hargajual'],
      pembelian: ['date', 'idkontak', 'status', 'user'],
      produk_beli: ['namaproduk', 'qty', 'hargabeli'],
      kas: ['date', 'kategori', 'uraian', 'masuk', 'keluar'],
      kontak: ['nama', 'hp', 'kategori'],
      cicil: ['date', 'idpenjualan', 'jumlah'],
      ecer: ['date', 'namaproduk', 'qty'],
      users: ['user', 'role'],
      roles: ['role', 'hide'],
      cms: ['judul', 'kategori', 'status'],
      absen: ['date', 'user', 'tipe', 'jam'],
      toko: ['id', 'name', 'phone'],
      skema: ['sheet', 'cols', 'vis']
    },
    db: {}
  };
  HARD.shs.forEach(s => { HARD.db[s] = []; });
  HARD.db.skema = HARD.shs.map(s => [
    s,
    (HARD.cols[s] || []).join(','),
    (HARD.vis[s] || []).join(','),
    (HARD.cols[s] || []).join(',')
  ]);

  /* ============================================================
     2. MESIN UTAMA APEX ULTRA PWA KISS ABSOLUTE
     ============================================================ */
  const W = window, L = localStorage, $ = id => document.getElementById(id);
  let db = null, syncing = false, syncDebounce = null, persistDebounce = null, scanStream = null, scanTimer = null;

  const bc = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('sync') : { postMessage() {}, onmessage: null };
  const softRender = () => {
    const ae = document.activeElement;
    if (ae && (ae.id === 'q' || dom.fb.contains(ae) || dom.db.contains(ae))) return;
    if (K.u && K.idx === null && K.v !== 'edit') render();
  };
  bc.onmessage = e => {
    if (e.data === 'synced') idbGet('apex_matrix').then(m => { if (m && typeof m === 'object') Object.assign(K.db, m); applySchemaTable(); softRender(); });
    else if (e.data === 'kick' && !syncing) syn();
  };

  /* ---------------- IndexedDB ---------------- */
  function initDB(cb) {
    try {
      const rq = indexedDB.open('apex_db', 1);
      rq.onupgradeneeded = e => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
        if (!d.objectStoreNames.contains('mut')) d.createObjectStore('mut', { keyPath: 'i' });
      };
      rq.onsuccess = e => { db = e.target.result; cb?.(db); };
      rq.onerror = () => cb?.(null);
    } catch { cb?.(null); }
  }
  const idbGet = (key, st = 'kv') => new Promise(res => {
    if (!db) return res(null);
    try { const rq = db.transaction(st, 'readonly').objectStore(st).get(key); rq.onsuccess = () => res(rq.result ?? null); rq.onerror = () => res(null); } catch { res(null); }
  });
  const idbGetAll = (st = 'mut') => new Promise(res => {
    if (!db) return res([]);
    try { const rq = db.transaction(st, 'readonly').objectStore(st).getAll(); rq.onsuccess = () => res(rq.result ?? []); rq.onerror = () => res([]); } catch { res([]); }
  });
  function idbPut(val, key = null, st = 'kv') {
    if (!db) return;
    try {
      const s = db.transaction(st, 'readwrite').objectStore(st);
      st === 'kv' && key != null ? s.put(val, key) : s.put(val);
    } catch {}
  }
  function idbClearStore(st) {
    if (!db) return;
    try { if (db.objectStoreNames.contains(st)) db.transaction(st, 'readwrite').objectStore(st).clear(); } catch {}
  }
  function idbDelKeys(keys, st = 'mut') {
    if (!db || !keys?.length) return;
    try {
      const s = db.transaction(st, 'readwrite').objectStore(st);
      keys.forEach(k => s.delete(k));
    } catch {}
  }

  /* ---------------- Antrean Mutasi FIFO ---------------- */
  let seq = 0, saves = 0;
  function save(row, targetTable = K.cur, actionType = 2) {
    saves++;
    const cloned = Array.isArray(row) ? row.slice() : Object.values(row);
    idbPut({
      i: Date.now().toString(36) + (seq = (seq + 1) % 46656).toString(36).padStart(3, '0') + Math.random().toString(36).slice(2, 4),
      tn: targetTable,
      y: actionType,
      r: cloned,
      ts: Date.now()
    }, null, 'mut');
    bc.postMessage('kick');
    clearTimeout(syncDebounce);
    syncDebounce = setTimeout(() => syn(false), 120);
  }

  /* ---------------- Transport ---------------- */
  const SYNC_ACTIONS = ['pull_batch', 'manifest', 'push', 'sync_gas'];

  async function req(p = {}) {
    p.u = p.u || L.u || K.u || 'admin';
    if (HARD.d1Url && SYNC_ACTIONS.includes(p.a)) {
      try {
        const res = await fetch(HARD.d1Url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(p),
          signal: AbortSignal.timeout?.(30000)
        });
        if (res.ok) {
          const r = await res.json();
          if (r?.ok || r?.s === 'ok' || r?.status === 'ok') return r;
        }
      } catch {}
    }
    if (p.a === 'sync_gas') return { ok: false, e: 'skip_fallback' };
    if (HARD.gasUrl && /^https?:\/\//i.test(HARD.gasUrl)) {
      try {
        const res = await fetch(HARD.gasUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(p),
          redirect: 'follow',
          signal: AbortSignal.timeout?.(30000)
        });
        const j = await res.json();
        return { ok: j?.ok ?? j?.s === 'ok', ...j };
      } catch (e) {
        return { ok: false, e };
      }
    }
    return { ok: false, e: 'offline' };
  }

  /* ---------------- Remap Baris Berdasarkan Urutan Kolom ---------------- */
  const remapRows = (rows, srcCols, dstCols) => {
    if (!Array.isArray(rows) || !rows.length || !Array.isArray(srcCols) || !Array.isArray(dstCols)) return rows || [];
    const sNorm = srcCols.map(S2), dNorm = dstCols.map(S2);
    if (sNorm.length === dNorm.length && sNorm.every((c, i) => c === dNorm[i])) return rows;
    const idxMap = dNorm.map(c => sNorm.indexOf(c));
    return rows.map(r => idxMap.map((si, di) => si !== -1 ? (r[si] ?? '') : (r[di] ?? '')));
  };

  /* ---------------- Sinkronisasi Online Skema & Data ---------------- */
  let again = 0;
  async function syn(force = false) {
    if (!navigator.onLine || !db) return false;
    if (syncing) { again = Math.max(again, force ? 2 : 1); return false; }
    syncing = true; msg('sedang sync...');
    let ok = false;
    try {
      const tables = [...K.shs];
      if (force) L.vs = '[]';
      const ver = JSON.parse(L.vs || '[]');

      const queuedBefore = await idbGetAll('mut');
      let m = null;

      if (force && !queuedBefore.length && HARD.d1Url && HARD.gasUrl) {
        const sg = await req({ a: 'sync_gas', tn: tables, cols: K.cols, gasUrl: HARD.gasUrl });
        if (sg?.ok && Array.isArray(sg.v)) m = sg;
      }

      if (!m) {
        const r0 = await req({ a: 'manifest', tn: tables, cols: K.cols, gasUrl: HARD.gasUrl });
        m = r0?.data || r0;
      }
      if (!m?.v) throw new Error('manifest');
      if (Array.isArray(m.shs)) m.shs.forEach(s => { if (!K.shs.includes(s)) K.shs.push(s); });
      if (m.cols && typeof m.cols === 'object') {
        Object.entries(m.cols).forEach(([k, sc]) => { if (!K.cols[k]) K.cols[k] = sc; });
      }
      if (m.vis && typeof m.vis === 'object') {
        Object.entries(m.vis).forEach(([k, sv]) => { if (!K.vis[k]) K.vis[k] = sv; });
      }

      // Pastikan seluruh antrean mutasi yang masuk hingga detik ini terkirim habis sebelum pull
      let queued = await idbGetAll('mut');
      const seed = [];
      K.shs.forEach((t, i) => {
        if ((m.v[i] === '0_0_0' || m.v[i] === '0_0' || !m.v[i]) && (K.db[t] || []).length) {
          (K.db[t] || []).forEach(row => seed.push({ tn: t, y: 2, r: row }));
        }
      });

      while (queued.length || seed.length) {
        const batch = [...seed.splice(0), ...queued];
        const pr = await req({ a: 'push', m: batch, tn: K.shs, cols: K.cols, gasUrl: HARD.gasUrl });
        if (!pr?.ok) throw new Error('push');
        idbDelKeys(queued.map(x => x.i), 'mut');
        m = pr.manifest || m;
        queued = await idbGetAll('mut');
      }

      const markAfterPush = saves;
      const toPull = [];
      K.shs.forEach((_, i) => { if (force || (m.v[i] && m.v[i] !== ver[i])) toPull.push({ t: i }); });
      if (toPull.length) {
        const b = await req({ a: 'pull_batch', reqs: toPull, tn: K.shs, cols: K.cols });
        if (saves !== markAfterPush || (await idbGetAll('mut')).length) {
          again = Math.max(again, 1);
        } else {
          const results = b?.data?.results || b?.results || [];
          const skemaRes = results.find(x => K.shs[x?.t] === 'skema');
          if (skemaRes && skemaRes.v) {
            ver[skemaRes.t] = skemaRes.v;
            K.db.skema = remapRows(skemaRes.r || [], skemaRes.cols, K.cols.skema);
            applySchemaTable();
          }
          results.forEach(x => {
            const name = K.shs[x?.t];
            if (!x?.v || !name || name === 'skema') return;
            ver[x.t] = x.v;
            const targetCols = K.cols[name] || x.cols || [];
            if (!K.cols[name] && Array.isArray(x.cols) && x.cols.length) K.cols[name] = x.cols;
            K.db[name] = remapRows(x.r || [], x.cols, targetCols);
          });
          if (skemaRes) applySchemaTable();
          L.vs = JSON.stringify(ver);
          persist(true);
          bc.postMessage('synced');
          softRender();
        }
      }
      ok = true;
    } catch {
      ok = false;
    } finally {
      syncing = false;
      const a = again; again = 0;
      if (a) setTimeout(() => syn(a === 2), 0);
    }
    msg(ok ? '' : 'offline');
    return ok;
  }

  /* ---------------- State & Manajemen Tabel Skema ---------------- */
  const dl = (content, fileName, mime = 'text/plain;charset=utf-8') => {
    const u = URL.createObjectURL(new Blob([content], { type: mime })), a = document.createElement('a');
    a.href = u; a.download = fileName; document.body.appendChild(a); a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(u); }, 400);
  };

  const K = {
    u: L.u || '', cur: 'penjualan', v: 'dash', idx: null, page: 1, sort: 0, dir: 1, grid: false,
    conf: null, prefill: null, parent: null, receiptRaw: '', prodIdx: null, slice: '',
    df: { u: '', from: '', to: '', kat: '' },
    shs: [...HARD.shs], cols: JSON.parse(JSON.stringify(HARD.cols)), vis: JSON.parse(JSON.stringify(HARD.vis)),
    fvis: {}, db: JSON.parse(JSON.stringify(HARD.db)),
    ret: null, prev: null, writing: false
  };

  K.shs.forEach(s => {
    if (!K.cols[s]) K.cols[s] = ['id', 'nama', 'ket'];
    if (!K.vis[s]) K.vis[s] = K.cols[s].slice(0, 3);
    if (!K.db[s]) K.db[s] = [];
  });

  function applySchemaTable() {
    if (!Array.isArray(K.db.skema)) K.db.skema = [];
    const existingMap = new Map(K.db.skema.map(r => [S2(r[0]), r]));

    HARD.shs.forEach(s => {
      const sh = S2(s);
      if (sh && !existingMap.has(sh)) {
        const newRow = [
          sh,
          (K.cols[sh] || ['id', 'nama', 'ket']).join(','),
          (K.vis[sh] || (K.cols[sh] || []).slice(0, 3)).join(','),
          (K.fvis[sh] || K.cols[sh] || ['id', 'nama', 'ket']).join(',')
        ];
        K.db.skema.push(newRow);
        existingMap.set(sh, newRow);
      }
    });

    const newShs = [];
    K.db.skema.forEach(r => {
      const sh = S2(r[0]);
      if (!sh || newShs.includes(sh)) return;
      newShs.push(sh);
      const oldCols = (K.cols[sh] || ['id', 'nama', 'ket']).slice();
      const nc = String(r[1] || '').split(',').map(S2).filter(Boolean);
      const nv = String(r[2] || '').split(',').map(S2).filter(Boolean);
      const nf = String(r[3] || '').split(',').map(S2).filter(Boolean);
      if (nc.length) K.cols[sh] = nc;
      else if (!K.cols[sh]) K.cols[sh] = ['id', 'nama', 'ket'];
      const vValid = nv.filter(x => K.cols[sh].includes(x));
      const fValid = nf.filter(x => K.cols[sh].includes(x));
      K.vis[sh] = vValid.length ? vValid : K.cols[sh].slice(0, 3);
      K.fvis[sh] = fValid.length ? fValid : K.cols[sh].slice();
      K.db[sh] = remapRows(K.db[sh] || [], oldCols, K.cols[sh]);
      (K.db[sh] || []).forEach(dr => {
        if (dr.length > K.cols[sh].length) dr.length = K.cols[sh].length;
        while (dr.length < K.cols[sh].length) dr.push('');
      });
    });

    if (newShs.length) {
      K.shs.forEach(s => {
        if (!newShs.includes(s) && !HARD.shs.includes(s)) {
          delete K.db[s]; delete K.cols[s]; delete K.vis[s]; delete K.fvis[s];
        }
      });
      HARD.shs.forEach(s => { if (!newShs.includes(s)) newShs.push(s); });
      K.shs = newShs;
      if (!K.shs.includes(K.cur)) K.cur = K.shs[0];
    }
  }

  /* ---------------- Barcode Scanner ---------------- */

  /* ---------------- Transaksi ---------------- */
  const calcItems = (t, id) => {
    const ch = childOf(t);

    return (K.db[ch] || []).reduce((a, r) => {
      if (S2(cV(r, ch, fkCol(ch))) !== S2(id)) return a;

            b = N(cV(r, ch, 'hargabeli')), s = N(cV(r, ch, 'hargajual')), d = N(cV(r, ch, 'diskon')),
            dLine = d > 0 ? (d < p ? d * q : d) : 0, dU = q > 0 ? dLine / q : 0;

  const trxNet = (t, r) => { const { raw, disc } = calcItems(t, r[0]); return Math.max(0, raw - disc - N(cV(r, t, 'diskon'))); };

          gTot = Math.max(0, raw - disc - N(val('diskon'))), diff = paid - gTot, WL = 32, store = getStore(),
          pad = s => { const t = String(s || '').trim(); if (t.length >= WL) return t.slice(0, WL); const l = Math.floor((WL - t.length) / 2); return ' '.repeat(l) + t + ' '.repeat(WL - t.length - l); },

                   lr(`${val('date') || today()} ${id}`, val('user') || K.u || 'admin'), bar('-')].filter(Boolean);

  const syncTrx = (t, forceStatus = false) => {
    const id = K.parent?.id || (K.idx >= 0 ? K.db[t]?.[K.idx]?.[0] : null);
    if (!id) return;

  const getOpenTrx = t => {

  const refreshRefButtons = () => {

  };

  const queryRows = () => {
    const rows = K.db[K.cur] || [], q = S2(dom.q.value).split(/\s+/).filter(Boolean),
          pType = parentOf(K.cur), op = pType ? getOpenTrx(pType) : null, res = [],
          cm = K.slice === 'piutang' ? cicilMap() : null, pm = prodMap(), km = kontakMap();

    const sliceChecks = {
      ready: r => K.cur !== 'produk' || (Z(cV(r, 'produk', 'stok')) > 0 && matchFilter('', '', `${cV(r, 'produk', 'namaproduk')} ${cV(r, 'produk', 'subkategori')} ${cV(r, 'produk', 'kategori')}`, true)),
      sisa_stok: r => K.cur !== 'produk' || matchFilter('', '', `${cV(r, 'produk', 'namaproduk')} ${cV(r, 'produk', 'subkategori')} ${cV(r, 'produk', 'kategori')}`, true),

      saldo_filter: r => K.cur !== 'penjualan' || matchFilter(cV(r, 'penjualan', 'user'), cV(r, 'penjualan', 'date'), `${cV(r, 'penjualan', 'idkontak')} ${resolveKontakName(cV(r, 'penjualan', 'idkontak'), km)} ${cV(r, 'penjualan', 'catatan')} ${calcItems('penjualan', r[0]).items.map(it => cV(pm.get(S2(it.id)), 'produk', 'kategori')).join(' ')}`),

    };

    for (let i = 0; i < rows.length; i++) {
      const r = rows[i] || [];

        if (S2(cV(r, K.cur, fkCol(K.cur))) !== S2(op.id)) continue;

        const pUser = S2(cV(pRow, pType, 'user'));

  const compressImg = (file, cb) => {
    readFile(file, 'readAsDataURL', dataUrl => {
      const img = new Image();
      img.onload = () => {
        const maxW = 480, scale = img.width > maxW ? maxW / img.width : 1;
        const can = document.createElement('canvas');
        can.width = Math.round(img.width * scale);
        can.height = Math.round(img.height * scale);
        const ctx = can.getContext('2d');
        ctx.drawImage(img, 0, 0, can.width, can.height);
        cb(can.toDataURL('image/jpeg', 0.65));
      };
      img.onerror = () => cb(dataUrl);
      img.src = dataUrl;
    });
  };

  function importText(text) {
    const lines = text.split(/\r?\n/).filter(Boolean);
    if (!lines.length) return;
    const sep = lines[0].includes('\t') ? '\t' : (lines[0].includes(';') ? ';' : ','), c = cols(),
          start = lines[0].split(sep).map(s => s.trim().toLowerCase()).every(h => c.includes(h)) ? 1 : 0;
    for (let i = start; i < lines.length; i++) {
      const parts = lines[i].split(sep).map(s => s.trim()), row = new Array(c.length).fill('');
      for (let j = 0; j < Math.min(parts.length, c.length); j++) row[j] = parts[j];
      if (!row[0]) row[0] = genId();
      (K.db[K.cur] = K.db[K.cur] || []).push(row); save(row, K.cur, 2);
    }
    if (K.cur === 'skema') applySchemaTable();
    persist(true); syn(true); render();
  }

  document.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.a && actions[t.dataset.a]) actions[t.dataset.a](t);
    const file = t.files?.[0];
    if (!file) return;

    if (t === dom.fCam || t === dom.fImg || t === dom.fDoc) {
      const isDoc = t === dom.fDoc, trgCol = isDoc ? 'file' : 'foto',
            tInp = fld(trgCol) || fldBy(new RegExp(trgCol, 'i')), jInp = isDoc ? fldBy(/judul|nama/i) : null;
      if (jInp && !jInp.value) jInp.value = file.name;
      if (isDoc) {
        readFile(file, 'readAsDataURL', data => { if (tInp) { tInp.value = data; updateFormThumb(tInp); } });
      } else {
        compressImg(file, data => { if (tInp) { tInp.value = data; updateFormThumb(tInp); } });
      }
      t.value = '';
    } else if (t === dom.fImp) {
      readFile(file, 'readAsText', importText);
      t.value = '';
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && dom.fb.contains(e.target)) {
      e.preventDefault();
      if (K.writing) return;
      if (!K.u) actions.login();
      else actions['save-row']();
    } else if (e.key === 'Escape') {
      if (!dom.scanBox.hidden) stopScan(); else actions.back();
    }
  });

  W.addEventListener('online', () => syn(true));
  navigator.storage?.persist?.().catch(() => {});
  if (navigator.serviceWorker && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }

  /* ---------------- Boot ---------------- */
  (() => {
    if (L.theme) applyTheme(L.theme);
    try {
      const d = JSON.parse(L.getItem('apex') || 'null');
      if (d && typeof d === 'object') {
        ['shs', 'cols', 'vis', 'fvis'].forEach(k => { if (d[k]) K[k] = d[k]; });
        if (d.parent && typeof d.parent === 'object') K.parent = d.parent;
        if (d.cur && K.shs.includes(d.cur)) K.cur = d.cur;
        if (d.u) K.u = L.u = d.u;
        if (d.df && typeof d.df === 'object') K.df = Object.assign(K.df, d.df);
        K.grid = Boolean(d.grid);
      }
    } catch {}
    initDB(async () => {
      const matrix = await idbGet('apex_matrix');
      if (matrix && typeof matrix === 'object') Object.assign(K.db, matrix);
      applySchemaTable();
      render();
      syn(true);
    });
  })();
  </script>
</body>
</html>
